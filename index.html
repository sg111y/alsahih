const MT2={"أبي بن كعب|اللقطة": "أخذتُ صُرّةً فيها مائة دينار، فأتيتُ النبي ﷺ فقال: عرِّفها حولًا. فعرّفتُها حولًا فلم أجد من يعرفها، ثم أتيتُه فقال: عرِّفها حولًا. فعرّفتُها فلم أجد، ثم أتيتُه ثلاثًا فقال: احفظ وِعاءَها وعددَها ووكاءَها، فإن جاء صاحبها وإلا فاستمتِعْ بها. فاستمتعتُ بها. فلقيتُه بعد بمكة فقال: لا أدري ثلاثةَ أحوالٍ أو حولًا واحدًا.", "أبي بن كعب|ما جاء فيمن جامع ولم ينزل": "قال أبي بن كعب: يا رسول الله، إذا جامع الرجلُ المرأةَ فلم يُنزل؟ قال: يغسل ما مسّ المرأةَ منه، ثم يتوضأ ويصلي.", "أبي بن كعب|ثبوت المعوذتين": "سألتُ أُبيَّ بن كعب، قلتُ: يا أبا المنذر، إن أخاك ابنَ مسعود يقول كذا وكذا. فقال أُبيّ: سألتُ رسول الله ﷺ فقال لي: قيل لي، فقلتُ. قال: فنحن نقول كما قال رسول الله ﷺ.", "أبي بن كعب|فضل آية الكرسي": "يا أبا المنذر، أتدري أيُّ آيةٍ من كتاب الله معك أعظم؟ قال: قلتُ: الله ورسوله أعلم. قال: يا أبا المنذر، أتدري أيُّ آيةٍ من كتاب الله معك أعظم؟ قلتُ: ﴿الله لا إله إلا هو الحي القيوم﴾. قال: فضرب في صدري وقال: والله ليهنِكَ العلمُ أبا المنذر.", "أبي بن كعب|ليلة القدر": "قيل: إن عبد الله بن مسعود يقول: من يقمِ الحول يُصِب ليلة القدر. فقال أُبيّ: يرحمه الله، أراد ألا يتّكل الناس، أما إنه قد علم أنها في رمضان، وأنها في العشر الأواخر، وأنها ليلة سبع وعشرين. ثم حلف لا يستثني أنها ليلة سبع وعشرين. فقلتُ: بأي شيء تقول ذلك يا أبا المنذر؟ قال: بالعلامة أو بالآية التي أخبرنا رسول الله ﷺ أنها تطلع يومئذٍ لا شعاع لها.", "أبي بن كعب|فضل أبي بن كعب": "قال عمر رضي الله عنه: أقرؤنا أُبيّ، وأقضانا عليّ، وإنّا لندع من قول أُبيّ، وذاك أن أُبيًّا يقول: لا أدع شيئًا سمعتُه من رسول الله ﷺ، وقد قال الله تعالى: ﴿ما ننسخ من آية أو ننسها﴾.", "أسامة بن زيد|ما جاء في الطاعون": "إن هذا الوجع — أو السقم — رجزٌ عُذِّب به بعضُ الأمم، ثم بقي منه بقيةٌ، فيذهب المرةَ ويأتي الأخرى، فمن سمع به بأرضٍ فلا يقدمنَّ عليه، ومن كان بأرضٍ وقع بها فلا يخرجنَّ فرارًا منه.", "أسامة بن زيد|النهي عن قتل من قال لا إله إلا الله": "بعثنا رسول الله ﷺ إلى الحُرَقة من جُهينة، فصبّحنا القوم فهزمناهم، ولحقتُ أنا ورجلٌ من الأنصار رجلًا منهم، فلما غشيناه قال: لا إله إلا الله، فكفّ عنه الأنصاري، وطعنتُه برمحي حتى قتلتُه. فلما قدمنا بلغ ذلك النبي ﷺ فقال لي: يا أسامة، أقتلتَه بعدما قال: لا إله إلا الله؟ قلتُ: يا رسول الله، إنما كان متعوّذًا. فقال: أقتلتَه بعدما قال: لا إله إلا الله؟ فما زال يكرّرها عليّ حتى تمنّيتُ أني لم أكن أسلمتُ قبل ذلك اليوم.", "أسامة بن زيد|التعزية عند موت الولد": "أرسلت ابنةُ النبي ﷺ إليه: إن ابنًا لي قُبض فائتِنا. فأرسل يقرئ السلام ويقول: إن لله ما أخذ وله ما أعطى، وكلٌّ عنده بأجلٍ مسمّى، فلتصبر ولتحتسب. فأرسلت إليه تُقسم عليه ليأتينّها، فقام ومعه سعد بن عبادة ومعاذ بن جبل وأُبيّ بن كعب وزيد بن ثابت ورجال، فرُفع إلى رسول الله ﷺ الصبيُّ ونفسُه تتقعقع، ففاضت عيناه. فقال سعد: يا رسول الله، ما هذا؟ فقال: هذه رحمةٌ جعلها الله في قلوب عباده، وإنما يرحم الله من عباده الرحماء.", "أسامة بن زيد|فتنة النساء": "ما تركتُ بعدي فتنةً أضرَّ على الرجال من النساء.", "أسامة بن زيد|أكثر أهل الجنة وأكثر أهل النار": "قمتُ على باب الجنة، فإذا عامّةُ من دخلها المساكين، وأصحابُ الجَدِّ محبوسون، غير أن أصحاب النار قد أُمر بهم إلى النار. وقمتُ على باب النار، فإذا عامةُ من دخلها النساء.", "أسامة بن زيد|صفة دفع الحاج من عرفة": "سُئل أسامة وأنا جالس: كيف كان رسول الله ﷺ يسير في حجة الوداع حين دفع؟ قال: كان يسير العَنَقَ، فإذا وجد فجوةً نصّ.", "أسامة بن زيد|كثرة الفتن وتتابعها": "أشرف النبي ﷺ على أُطُمٍ من آطام المدينة فقال: هل ترون ما أرى؟ إني لأرى مواقع الفتن خلال بيوتكم كمواقع القطر.", "أسامة بن زيد|ربا النسيئة": "إنما الربا في النسيئة.", "أسامة بن زيد|مناقب الحسن بن علي وأسامة بن زيد": "كان النبي ﷺ يأخذني والحسن فيقول: اللهم إني أحبهما فأحبَّهما.", "أسامة بن زيد|صلاة العشاءين بعد الإفاضة": "دفع رسول الله ﷺ من عرفة حتى إذا كان بالشِّعب نزل فبال، ثم توضأ ولم يُسبغ الوضوء، فقلتُ: الصلاة يا رسول الله. فقال: الصلاةُ أمامك. فركب، فلما جاء المزدلفة نزل فتوضأ فأسبغ الوضوء، ثم أُقيمت الصلاة فصلّى المغرب، ثم أناخ كلُّ إنسانٍ بعيرَه في منزله، ثم أُقيمت العشاء فصلّى ولم يُصلِّ بينهما.", "أسامة بن زيد|خطر من يخالف قوله فعله": "يُجاء بالرجل يوم القيامة فيُلقى في النار، فتندلق أقتابُه في النار، فيدور كما يدور الحمار برحاه، فيجتمع أهل النار عليه فيقولون: أيْ فلان، ما شأنك؟ أليس كنتَ تأمرنا بالمعروف وتنهانا عن المنكر؟ قال: كنتُ آمركم بالمعروف ولا آتيه، وأنهاكم عن المنكر وآتيه.", "أسامة بن زيد|كراهة العزل": "قال رجل: إني أعزل عن امرأتي. فقال له رسول الله ﷺ: لِمَ تفعل ذلك؟ فقال الرجل: أُشفق على ولدها — أو على أولادها. فقال رسول الله ﷺ: لو كان ذلك ضارًّا ضرَّ فارسَ والرومَ.", "أسامة بن زيد|دخول الكعبة والصلاة فيها": "لما دخل النبي ﷺ البيت دعا في نواحيه كلها، ولم يصلِّ فيه حتى خرج، فلما خرج ركع ركعتين في قُبُل الكعبة وقال: هذه القبلة.", "أسيد بن حضير|الصبر عند الأثرة": "إنكم ستلقون بعدي أثَرةً، فاصبروا حتى تلقوني على الحوض.", "البراء بن عازب|ربا النسيئة": "قدم النبي ﷺ المدينة ونحن نتبايع هذا البيع، فقال: ما كان يدًا بيد فلا بأس به، وما كان نسيئةً فلا يصلح، وائتِ زيد بن أرقم فإنه كان أعظم تجارةً مني."};
const MT={"عذاب القبر": "إذا أُقعد المؤمن في قبره أُتي، ثم شهد أن لا إله إلا الله وأن محمدًا رسول الله، فذلك قوله: ﴿يثبت الله الذين آمنوا بالقول الثابت﴾. قال: نزلت في عذاب القبر.", "الدعاء عند النوم": "إذا أتيتَ مضجعك فتوضأ وضوءك للصلاة، ثم اضطجع على شقك الأيمن، ثم قل: اللهم أسلمتُ وجهي إليك، وفوّضتُ أمري إليك، وألجأتُ ظهري إليك، رغبةً ورهبةً إليك، لا ملجأ ولا منجى منك إلا إليك، اللهم آمنتُ بكتابك الذي أنزلتَ، وبنبيك الذي أرسلتَ. فإن مِتّ من ليلتك فأنت على الفطرة، واجعلهن آخر ما تتكلم به. قال: فرددتها على النبي ﷺ، فلما بلغتُ: اللهم آمنتُ بكتابك الذي أنزلتَ، قلت: ورسولك. قال: لا، ونبيّك الذي أرسلتَ.", "تحريم الحمر الأهلية": "أمرنا النبي ﷺ في غزوة خيبر أن نُلقي الحمر الأهلية نيئةً ونضيجةً، ثم لم يأمرنا بأكله بعد.", "متابعة الإمام وعدم سبقه": "كان رسول الله ﷺ إذا قال: سمع الله لمن حمده، لم يَحنِ أحدٌ منا ظهره حتى يقع النبي ﷺ ساجدًا، ثم نقع سجودًا بعده.", "حب الأنصار من الإيمان": "الأنصار لا يحبهم إلا مؤمن، ولا يبغضهم إلا منافق، فمن أحبهم أحبه الله، ومن أبغضهم أبغضه الله.", "مناقب الحسن بن علي": "رأيتُ النبي ﷺ والحسن بن علي على عاتقه يقول: اللهم إني أحبه فأحبه.", "فضل الشعر في نصرة الدين": "قال النبي ﷺ لحسان: اهجُهم — أو هاجِهم — وجبريل معك.", "القراءة في العشاء": "سمعتُ النبي ﷺ يقرأ في العشاء: ﴿والتين والزيتون﴾، فما سمعتُ أحدًا أحسن صوتًا أو قراءةً منه.", "فضل سورة الكهف": "كان رجلٌ يقرأ سورة الكهف وإلى جانبه حصانٌ مربوطٌ بشطنين، فتغشّته سحابة، فجعلت تدنو وتدنو، وجعل فرسه ينفر منها. فلما أصبح أتى النبي ﷺ فذكر ذلك له، فقال: تلك السكينة تنزلت للقرآن.", "بعض صفاته ﷺ": "كان رسول الله ﷺ رجلًا مربوعًا، بعيد ما بين المنكبين، عظيم الجمّة إلى شحمة أذنيه، عليه حلّة حمراء، ما رأيتُ شيئًا قطّ أحسن منه ﷺ.", "رفع المرفقين عن الأرض في السجود": "إذا سجدتَ فضع كفيك وارفع مرفقيك.", "حسن النبي ﷺ": "سُئل البراء: أكان وجه النبي ﷺ مثل السيف؟ قال: لا، مثل القمر.", "عدد غزوات النبي ﷺ": "غزوتُ مع النبي ﷺ خمس عشرة.", "عدة أصحاب بدر": "حدّثني أصحاب محمد ﷺ ممن شهد بدرًا أنهم كانوا عدّة أصحاب طالوت الذين جازوا معه النهر، بضعةَ عشر وثلاثمائة. قال البراء: لا والله ما جاوز معه النهر إلا مؤمن.", "أمرنا بسبع ونهانا عن سبع": "أمرنا رسول الله ﷺ بسبع ونهانا عن سبع: أمرنا بعيادة المريض، واتباع الجنازة، وتشميت العاطس، وإبرار المقسم، ونصر المظلوم، وإجابة الداعي، وإفشاء السلام. ونهانا عن خواتيم — أو عن تختّم — الذهب، وعن الشرب في الفضة، وعن المياثر، وعن القسّي، وعن لبس الحرير والإستبرق والديباج.", "آخر ما نزل من القرآن": "آخر آية نزلت: ﴿يستفتونك قل الله يفتيكم في الكلالة﴾، وآخر سورة نزلت: براءة.", "قنوت النوازل": "قنت رسول الله ﷺ في الفجر والمغرب.", "الذكر عند النوم": "كان النبي ﷺ إذا أخذ مضجعه قال: باسمك اللهم أحيا وأموت، وإذا استيقظ قال: الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور.", "أولاد المسلمين في الآخرة": "لما توفي إبراهيم قال رسول الله ﷺ: إن له مرضعًا في الجنة.", "الأجر الكثير في العمل اليسير": "أتى النبيَّ ﷺ رجلٌ مقنَّعٌ بالحديد فقال: يا رسول الله، أقاتل وأُسلم؟ قال: أسلِمْ ثم قاتل. فأسلم ثم قاتل فقُتل. فقال رسول الله ﷺ: عمل قليلًا وأُجر كثيرًا.", "فضل الجنة ونعيمها": "أُهديت لرسول الله ﷺ حلّة حرير، فجعل أصحابه يمسّونها ويعجبون من لينها، فقال: أتعجبون من لين هذه؟ لمناديل سعد بن معاذ في الجنة خيرٌ منها وألين."};

  if(!ks.length)o.y=leaf++;else{const ys=ks.map(([nm,v])=>walk(v,nm,d+1,o).y);o.y=(Math.min(...ys)+Math.max(...ys))/2}return o}
 [...root.k.entries()].forEach(([nm,v])=>walk(v,nm,0,null));
 const cw=Array(maxD+1).fill(80);nodes.forEach(o=>cw[o.d]=Math.max(cw[o.d],o.name.length*9.4+30));
 const gap=44,pad=14,RH=56,NH=38;TW=pad*2+cw.reduce((a,b)=>a+b,0)+gap*maxD;TH=pad*2+leaf*RH;
 const xs=[];let acc=0;cw.forEach((w,i)=>{xs[i]=TW-pad-acc-w;acc+=w+gap});
 nodes.forEach(o=>{o.x=xs[o.d];o.w=cw[o.d];o.cy=pad+o.y*RH+RH/2});
 let e="",r="";
 nodes.forEach(o=>{if(o.p){const x1=o.p.x,y1=o.p.cy,x2=o.x+o.w,y2=o.cy,m=(x1+x2)/2;e+=`<path class="ed" d="M${x1} ${y1} C${m} ${y1},${m} ${y2},${x2} ${y2}"/>`}
  const cl=comp.has(o.name)?"nd gold":md.has(o.name)?"nd mud":"nd";
  r+=`<g class="gn" data-n="${o.name}"><rect class="${cl}" x="${o.x}" y="${o.cy-NH/2}" width="${o.w}" height="${NH}" rx="11"/><text class="tx${comp.has(o.name)?" gt":""}" x="${o.x+o.w/2}" y="${o.cy}" text-anchor="middle" dominant-baseline="central">${o.name}</text></g>`});
 tz=1;
 return `<div class="tabs"><button class="tab" data-z="1">＋</button><button class="tab" data-z="-1">－</button><button class="tab" data-z="0">ملاءمة العرض</button></div>
 <div class="hint"><span class="lg" style="background:#f0be5a"></span> الصحابي &nbsp; <span class="lg" style="background:var(--chip);border:2px solid #c08a20"></span> المدار</div>
 <div class="tw" id="tw"><svg id="sv" xmlns="http://www.w3.org/2000/svg" width="${TW}" height="${TH}" viewBox="0 0 ${TW} ${TH}" direction="rtl">${e}${r}</svg></div>`}
function applyZ(){const sv=$("sv");if(sv){sv.setAttribute("width",TW*tz);sv.setAttribute("height",TH*tz)}}
function zoomT(d){if(!$("sv"))return;if(d===0)tz=Math.min(1.3,Math.max(.35,($("tw").clientWidth-4)/TW));else tz=Math.min(2.5,Math.max(.35,tz*(d>0?1.25:.8)));applyZ()}

 const top=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6);
 const mt=h=>MT2[h.m+"|"+h.t]||MT[h.t];
 const nm=H.filter(mt).length,nar=new Set(D.flatMap(d=>d.c)).size;
 const i=Math.floor(Date.now()/864e5)%H.length,h=H[i],t=mt(h);
 return `<div class="g"><div class="gh">خلاصة</div><div class="stats"><div class="st"><b>${H.length}</b>حديثًا</div><div class="st"><b>${nar}</b>راويًا</div><div class="st"><b>${D.length}</b>طريقًا</div><div class="st"><b>${nm}</b>متنًا مُدخلًا</div></div>
 <div class="ct" style="margin-top:8px">أكثر المدارات (اضغط لعرض أحاديثه):</div><div>${top.map(([p,c])=>`<button class="chip" data-q="${p}">${p} · ${c}</button>`).join("")}</div></div>
 <div class="g"><div class="gh">حديث اليوم</div><div class="h t" data-i="${i}"><b>${h.t}</b><span class="b">${[...h.ks].join(" / ")}</span><div class="ct">${h.m} · المدار: ${mudar(h)}</div>${t?`<div class="mt">${t.length>170?t.slice(0,170)+"…":t}</div>`:""}<div class="ct">اضغط لعرض السند والشجرة</div></div></div>`}
const CS=new Set("ابن عباس|أبي بن كعب|أسامة بن زيد|البراء بن عازب|سعد بن أبي وقاص|أبو جحيفة|أبو أيوب الأنصاري|أنس بن مالك|أسيد بن حضير|عمر بن الخطاب|عبد الله بن يزيد".split("|"));
function comp(){
 const mp=new Map;
 H.forEach((h,i)=>{if(cur!=="الكل"&&h.m!==cur)return;h.cs.forEach(c=>{for(let x=0;x<c.length-1;x++)if(CS.has(c[x])&&CS.has(c[x+1])){const seg=[c[x],c[x+1]],k=seg.join("|");let e=mp.get(k);if(!e){e={seg,k,hs:new Map,st:new Set};mp.set(k,e)}if(!e.hs.has(i))e.hs.set(i,[]);e.hs.get(i).push(c)}})});
 SL=[...mp.values()].filter(e=>!q||e.k.includes(q)||[...e.hs.keys()].some(i=>H[i].t.includes(q))).sort((a,b)=>b.hs.size-a.hs.size);

 let x;
