const MT2={"أبي بن كعب|قصة موسى والخضر": "أَنَّ مُوسَى قَامَ خَطِيبًا فِي بَنِي إِسْرَائِيلَ، فَسُئِلَ : أَيُّ النَّاسِ أَعْلَمُ ؟ فَقَالَ : أَنَا. فَعَتَبَ اللَّهُ عَلَيْهِ إِذْ لَمْ يَرُدَّ الْعِلْمَ إِلَيْهِ، فَقَالَ لَهُ : بَلَى، لِي عَبْدٌ بِمَجْمَعِ الْبَحْرَيْنِ هُوَ أَعْلَمُ مِنْكَ. قَالَ : أَيْ رَبِّ، وَمَنْ لِي بِهِ ؟ - وَرُبَّمَا قَالَ سُفْيَانُ : أَيْ رَبِّ، وَكَيْفَ لِي بِهِ ؟ - قَالَ : تَأْخُذُ حُوتًا فَتَجْعَلُهُ فِي مِكْتَلٍ، حَيْثُمَا فَقَدْتَ الْحُوتَ فَهُوَ ثَمَّ - وَرُبَّمَا قَالَ : فَهُوَ ثَمَّهْ - وَأَخَذَ حُوتًا فَجَعَلَهُ فِي مِكْتَلٍ، ثُمَّ انْطَلَقَ هُوَ وَفَتَاهُ يُوشَعُ بْنُ نُونٍ، حَتَّى أَتَيَا الصَّخْرَةَ وَضَعَا رُءُوسَهُمَا، فَرَقَدَ مُوسَى، وَاضْطَرَبَ الْحُوتُ فَخَرَجَ فَسَقَطَ فِي الْبَحْرِ، ﴿فَاتَّخَذَ سَبِيلَهُ فِي الْبَحْرِ سَرَبًا﴾. فَأَمْسَكَ اللَّهُ عَنِ الْحُوتِ جِرْيَةَ الْمَاءِ فَصَارَ مِثْلَ الطَّاقِ - فَقَالَ : هَكَذَا مِثْلُ الطَّاقِ - فَانْطَلَقَا يَمْشِيَانِ بَقِيَّةَ لَيْلَتِهِمَا وَيَوْمَهُمَا، حَتَّى إِذَا كَانَ مِنَ الْغَدِ ﴿قَالَ لِفَتَاهُ آتِنَا غَدَاءَنَا لَقَدْ لَقِينَا مِنْ سَفَرِنَا هَذَا نَصَبًا﴾. وَلَمْ يَجِدْ مُوسَى النَّصَبَ حَتَّى جَاوَزَ حَيْثُ أَمَرَهُ اللَّهُ. قَالَ لَهُ فَتَاهُ : أَرَأَيْتَ إِذْ أَوَيْنَا إِلَى الصَّخْرَةِ فَإِنِّي نَسِيتُ الْحُوتَ وَمَا أَنْسَانِيهُ إِلَّا الشَّيْطَانُ أَنْ أَذْكُرَهُ وَاتَّخَذَ سَبِيلَهُ فِي الْبَحْرِ عَجَبًا. فَكَانَ لِلْحُوتِ سَرَبًا وَلَهُمَا عَجَبًا. قَالَ لَهُ مُوسَى : ذَلِكَ مَا كُنَّا نَبْغِي فَارْتَدَّا عَلَى آثَارِهِمَا قَصَصًا، رَجَعَا يَقُصَّانِ آثَارَهُمَا حَتَّى انْتَهَيَا إِلَى الصَّخْرَةِ، فَإِذَا رَجُلٌ مُسَجًّى بِثَوْبٍ، فَسَلَّمَ مُوسَى فَرَدَّ عَلَيْهِ، فَقَالَ : وَأَنَّى بِأَرْضِكَ السَّلَامُ ؟ قَالَ : أَنَا مُوسَى. قَالَ : مُوسَى بَنِي إِسْرَائِيلَ ؟ قَالَ : نَعَمْ، أَتَيْتُكَ لِتُعَلِّمَنِي ﴿مِمَّا عُلِّمْتَ رُشْدًا﴾. قَالَ : يَا مُوسَى، إِنِّي عَلَى عِلْمٍ مِنْ عِلْمِ اللَّهِ عَلَّمَنِيهِ اللَّهُ لَا تَعْلَمُهُ، وَأَنْتَ عَلَى عِلْمٍ مِنْ عِلْمِ اللَّهِ عَلَّمَكَهُ اللَّهُ لَا أَعْلَمُهُ. قَالَ : هَلْ أَتَّبِعُكَ ؟ ﴿قَالَ إِنَّكَ لَنْ تَسْتَطِيعَ مَعِيَ صَبْرًا﴾ ﴿وَكَيْفَ تَصْبِرُ عَلَى مَا لَمْ تُحِطْ بِهِ خُبْرًا﴾ إِلَى قَوْلِهِ : ﴿إِمْرًا﴾. فَانْطَلَقَا يَمْشِيَانِ عَلَى سَاحِلِ الْبَحْرِ، فَمَرَّتْ بِهِمَا سَفِينَةٌ، كَلَّمُوهُمْ أَنْ يَحْمِلُوهُمْ، فَعَرَفُوا الْخَضِرَ فَحَمَلُوهُ بِغَيْرِ نَوْلٍ، فَلَمَّا رَكِبَا فِي السَّفِينَةِ جَاءَ عُصْفُورٌ فَوَقَعَ عَلَى حَرْفِ السَّفِينَةِ، فَنَقَرَ فِي الْبَحْرِ نَقْرَةً أَوْ نَقْرَتَيْنِ. قَالَ لَهُ الْخَضِرُ : يَا مُوسَى، مَا نَقَصَ عِلْمِي وَعِلْمُكَ مِنْ عِلْمِ اللَّهِ إِلَّا مِثْلَ مَا نَقَصَ هَذَا الْعُصْفُورُ بِمِنْقَارِهِ مِنَ الْبَحْرِ. إِذْ أَخَذَ الْفَأْسَ فَنَزَعَ لَوْحًا. قَالَ : فَلَمْ يَفْجَأْ مُوسَى إِلَّا وَقَدْ قَلَعَ لَوْحًا بِالْقَدُّومِ. فَقَالَ لَهُ مُوسَى : مَا صَنَعْتَ ؟ قَوْمٌ حَمَلُونَا بِغَيْرِ نَوْلٍ عَمَدْتَ إِلَى سَفِينَتِهِمْ فَخَرَقْتَهَا ﴿لِتُغْرِقَ أَهْلَهَا لَقَدْ جِئْتَ شَيْئًا إِمْرًا﴾ ﴿قَالَ أَلَمْ أَقُلْ إِنَّكَ لَنْ تَسْتَطِيعَ مَعِيَ صَبْرًا﴾ ﴿قَالَ لَا تُؤَاخِذْنِي بِمَا نَسِيتُ وَلَا تُرْهِقْنِي مِنْ أَمْرِي عُسْرًا﴾. فَكَانَتِ الْأُولَى مِنْ مُوسَى نِسْيَانًا. فَلَمَّا خَرَجَا مِنَ الْبَحْرِ مَرُّوا بِغُلَامٍ يَلْعَبُ مَعَ الصِّبْيَانِ، فَأَخَذَ الْخَضِرُ بِرَأْسِهِ فَقَلَعَهُ بِيَدِهِ هَكَذَا - وَأَوْمَأَ سُفْيَانُ بِأَطْرَافِ أَصَابِعِهِ كَأَنَّهُ يَقْطِفُ شَيْئًا - فَقَالَ لَهُ مُوسَى : ﴿أَقَتَلْتَ نَفْسًا زَكِيَّةً بِغَيْرِ نَفْسٍ لَقَدْ جِئْتَ شَيْئًا نُكْرًا﴾ ﴿قَالَ أَلَمْ أَقُلْ لَكَ إِنَّكَ لَنْ تَسْتَطِيعَ مَعِيَ صَبْرًا﴾ ﴿قَالَ إِنْ سَأَلْتُكَ عَنْ شَيْءٍ بَعْدَهَا فَلَا تُصَاحِبْنِي قَدْ بَلَغْتَ مِنْ لَدُنِّي عُذْرًا﴾ ﴿فَانْطَلَقَا حَتَّى إِذَا أَتَيَا أَهْلَ قَرْيَةٍ اسْتَطْعَمَا أَهْلَهَا فَأَبَوْا أَنْ يُضَيِّفُوهُمَا فَوَجَدَا فِيهَا جِدَارًا يُرِيدُ أَنْ يَنْقَضَّ﴾ مَائِلًا - أَوْمَأَ بِيَدِهِ هَكَذَا، وَأَشَارَ سُفْيَانُ كَأَنَّهُ يَمْسَحُ شَيْئًا إِلَى فَوْقُ، فَلَمْ أَسْمَعْ سُفْيَانَ يَذْكُرُ مَائِلًا إِلَّا مَرَّةً - قَالَ : قَوْمٌ أَتَيْنَاهُمْ فَلَمْ يُطْعِمُونَا وَلَمْ يُضَيِّفُونَا عَمَدْتَ إِلَى حَائِطِهِمْ ﴿لَوْ شِئْتَ لَاتَّخَذْتَ عَلَيْهِ أَجْرًا﴾ ﴿قَالَ هَذَا فِرَاقُ بَيْنِي وَبَيْنِكَ سَأُنَبِّئُكَ بِتَأْوِيلِ مَا لَمْ تَسْتَطِعْ عَلَيْهِ صَبْرًا﴾. قَالَ النَّبِيُّ ﷺ : «وَدِدْنَا أَنَّ مُوسَى كَانَ صَبَرَ، فَقَصَّ اللَّهُ عَلَيْنَا مِنْ خَبَرِهِمَا». قَالَ سُفْيَانُ : قَالَ النَّبِيُّ ﷺ : «يَرْحَمُ اللَّهُ مُوسَى، لَوْ كَانَ صَبَرَ يُقَصُّ عَلَيْنَا مِنْ أَمْرِهِمَا». وَقَرَأَ ابْنُ عَبَّاسٍ : ( أَمَامَهُمْ مَلِكٌ يَأْخُذُ كُلَّ سَفِينَةٍ صَالِحَةٍ غَصْبًا وَأَمَّا الْغُلَامُ فَكَانَ كَافِرًا وَكَانَ أَبَوَاهُ مُؤْمِنَيْنِ ). ثُمَّ قَالَ لِي سُفْيَانُ : سَمِعْتُهُ مِنْهُ مَرَّتَيْنِ، وَحَفِظْتُهُ مِنْهُ. قِيلَ لِسُفْيَانَ : حَفِظْتَهُ قَبْلَ أَنْ تَسْمَعَهُ مِنْ عَمْرٍو، أَوْ تَحَفَّظْتَهُ مِنْ إِنْسَانٍ ؟ فَقَالَ : مِمَّنْ أَتَحَفَّظُهُ ؟ وَرَوَاهُ أَحَدٌ عَنْ عَمْرٍو غَيْرِي ؟ سَمِعْتُهُ مِنْهُ مَرَّتَيْنِ أَوْ ثَلَاثًا، وَحَفِظْتُهُ مِنْهُ.", "أبي بن كعب|من أشراط الساعة": "كُنْتُ وَاقِفًا مَعَ أُبَيِّ بْنِ كَعْبٍ فَقَالَ : لَا يَزَالُ النَّاسُ مُخْتَلِفَةً أَعْنَاقُهُمْ فِي طَلَبِ الدُّنْيَا. قُلْتُ : أَجَلْ. قَالَ : إِنِّي سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ : «يُوشِكُ الْفُرَاتُ أَنْ يَحْسِرَ عَنْ جَبَلٍ مِنْ ذَهَبٍ، فَإِذَا سَمِعَ بِهِ النَّاسُ سَارُوا إِلَيْهِ، فَيَقُولُ مَنْ عِنْدَهُ : لَئِنْ تَرَكْنَا النَّاسَ يَأْخُذُونَ مِنْهُ لَيُذْهَبَنَّ بِهِ كُلِّهِ. قَالَ : فَيَقْتَتِلُونَ عَلَيْهِ، فَيُقْتَلُ مِنْ كُلِّ مِائَةٍ تِسْعَةٌ وَتِسْعُونَ». قَالَ أَبُو كَامِلٍ فِي حَدِيثِهِ : قَالَ : وَقَفْتُ أَنَا وَأُبَيُّ بْنُ كَعْبٍ فِي ظِلِّ أُجُمِ حَسَّانَ.", "أسامة بن زيد|تقلب المنافقين مع المسلمين": "أَنَّ رَسُولَ اللَّهِ ﷺ رَكِبَ عَلَى حِمَارٍ عَلَى قَطِيفَةٍ فَدَكِيَّةٍ، وَأَرْدَفَ أُسَامَةَ بْنَ زَيْدٍ وَرَاءَهُ يَعُودُ سَعْدَ بْنَ عُبَادَةَ فِي بَنِي الْحَارِثِ بْنِ الْخَزْرَجِ قَبْلَ وَقْعَةِ بَدْرٍ، قَالَ : حَتَّى مَرَّ بِمَجْلِسٍ فِيهِ عَبْدُ اللَّهِ بْنُ أُبَيٍّ ابْنُ سَلُولَ، وَذَلِكَ قَبْلَ أَنْ يُسْلِمَ عَبْدُ اللَّهِ بْنُ أُبَيٍّ، فَإِذَا فِي الْمَجْلِسِ أَخْلَاطٌ مِنَ الْمُسْلِمِينَ وَالْمُشْرِكِينَ عَبَدَةِ الْأَوْثَانِ، وَالْيَهُودِ وَالْمُسْلِمِينَ، وَفِي الْمَجْلِسِ عَبْدُ اللَّهِ بْنُ رَوَاحَةَ، فَلَمَّا غَشِيَتِ الْمَجْلِسَ عَجَاجَةُ الدَّابَّةِ خَمَّرَ عَبْدُ اللَّهِ بْنُ أُبَيٍّ أَنْفَهُ بِرِدَائِهِ، ثُمَّ قَالَ : لَا تُغَبِّرُوا عَلَيْنَا. فَسَلَّمَ رَسُولُ اللَّهِ ﷺ عَلَيْهِمْ، ثُمَّ وَقَفَ، فَنَزَلَ، فَدَعَاهُمْ إِلَى اللَّهِ، وَقَرَأَ عَلَيْهِمُ الْقُرْآنَ، فَقَالَ عَبْدُ اللَّهِ بْنُ أُبَيٍّ ابْنُ سَلُولَ : أَيُّهَا الْمَرْءُ إِنَّهُ لَا أَحْسَنَ مِمَّا تَقُولُ، إِنْ كَانَ حَقًّا فَلَا تُؤْذِنَا بِهِ فِي مَجْلِسِنَا، ارْجِعْ إِلَى رَحْلِكَ، فَمَنْ جَاءَكَ فَاقْصُصْ عَلَيْهِ. فَقَالَ عَبْدُ اللَّهِ بْنُ رَوَاحَةَ : بَلَى يَا رَسُولَ اللَّهِ، فَاغْشَنَا بِهِ فِي مَجَالِسِنَا؛ فَإِنَّا نُحِبُّ ذَلِكَ. فَاسْتَبَّ الْمُسْلِمُونَ وَالْمُشْرِكُونَ وَالْيَهُودُ حَتَّى كَادُوا يَتَثَاوَرُونَ، فَلَمْ يَزَلِ النَّبِيُّ ﷺ يُخَفِّضُهُمْ حَتَّى سَكَنُوا، ثُمَّ رَكِبَ النَّبِيُّ ﷺ دَابَّتَهُ، فَسَارَ حَتَّى دَخَلَ عَلَى سَعْدِ بْنِ عُبَادَةَ، فَقَالَ لَهُ النَّبِيُّ ﷺ : «يَا سَعْدُ، أَلَمْ تَسْمَعْ مَا قَالَ أَبُو حُبَابٍ - يُرِيدُ عَبْدَ اللَّهِ بْنَ أُبَيٍّ ؟ - قَالَ : كَذَا وَكَذَا». قَالَ سَعْدُ بْنُ عُبَادَةَ : يَا رَسُولَ اللَّهِ، اعْفُ عَنْهُ، وَاصْفَحْ عَنْهُ، فَوَالَّذِي أَنْزَلَ عَلَيْكَ الْكِتَابَ، لَقَدْ جَاءَ اللَّهُ بِالْحَقِّ الَّذِي أَنْزَلَ عَلَيْكَ، لَقَدِ اصْطَلَحَ أَهْلُ هَذِهِ الْبُحَيْرَةِ عَلَى أَنْ يُتَوِّجُوهُ فَيُعَصِّبُوهُ بِالْعِصَابَةِ، فَلَمَّا أَبَى اللَّهُ ذَلِكَ بِالْحَقِّ الَّذِي أَعْطَاكَ اللَّهُ شَرِقَ بِذَلِكَ، فَذَلِكَ فَعَلَ بِهِ مَا رَأَيْتَ، فَعَفَا عَنْهُ رَسُولُ اللَّهِ ﷺ، وَكَانَ النَّبِيُّ ﷺ وَأَصْحَابُهُ يَعْفُونَ عَنِ الْمُشْرِكِينَ وَأَهْلِ الْكِتَابِ، كَمَا أَمَرَهُمُ اللَّهُ، وَيَصْبِرُونَ عَلَى الْأَذَى، قَالَ اللَّهُ عَزَّ وَجَلَّ : ﴿وَلَتَسْمَعُنَّ مِنَ الَّذِينَ أُوتُوا الْكِتَابَ مِنْ قَبْلِكُمْ وَمِنَ الَّذِينَ أَشْرَكُوا أَذًى كَثِيرًا﴾ الْآيَةَ، وَقَالَ اللَّهُ : ﴿وَدَّ كَثِيرٌ مِنْ أَهْلِ الْكِتَابِ لَوْ يَرُدُّونَكُمْ مِنْ بَعْدِ إِيمَانِكُمْ كُفَّارًا حَسَدًا مِنْ عِنْدِ أَنْفُسِهِمْ﴾ إِلَى آخِرِ الْآيَةِ، وَكَانَ النَّبِيُّ ﷺ يَتَأَوَّلُ الْعَفْوَ مَا أَمَرَهُ اللَّهُ بِهِ حَتَّى أَذِنَ اللَّهُ فِيهِمْ، فَلَمَّا غَزَا رَسُولُ اللَّهِ ﷺ بَدْرًا، فَقَتَلَ اللَّهُ بِهِ صَنَادِيدَ كُفَّارِ قُرَيْشٍ، قَالَ ابْنُ أُبَيٍّ ابْنُ سَلُولَ، وَمَنْ مَعَهُ مِنَ الْمُشْرِكِينَ، وَعَبَدَةِ الْأَوْثَانِ : هَذَا أَمْرٌ قَدْ تَوَجَّهَ فَبَايِعُوا الرَّسُولَ ﷺ عَلَى الْإِسْلَامِ. فَأَسْلَمُوا.", "أسامة بن زيد|توريث بيوت مكة وحكم بيعها": "أَنَّهُ قَالَ : يَا رَسُولَ اللَّهِ، أَيْنَ تَنْزِلُ فِي دَارِكَ بِمَكَّةَ ؟ فَقَالَ : «وَهَلْ تَرَكَ عَقِيلٌ مِنْ رِبَاعٍ أَوْ دُورٍ ؟». وَكَانَ عَقِيلٌ وَرِثَ أَبَا طَالِبٍ هُوَ وَطَالِبٌ، وَلَمْ يَرِثْهُ جَعْفَرٌ، وَلَا عَلِيٌّ رَضِيَ اللَّهُ عَنْهُمَا شَيْئًا؛ لِأَنَّهُمَا كَانَا مُسْلِمَيْنِ، وَكَانَ عَقِيلٌ وَطَالِبٌ كَافِرَيْنِ، فَكَانَ عُمَرُ بْنُ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُ يَقُولُ : لَا يَرِثُ الْمُؤْمِنُ الْكَافِرَ. قَالَ ابْنُ شِهَابٍ : وَكَانُوا يَتَأَوَّلُونَ قَوْلَ اللَّهِ تَعَالَى : ﴿إِنَّ الَّذِينَ آمَنُوا وَهَاجَرُوا وَجَاهَدُوا بِأَمْوَالِهِمْ وَأَنْفُسِهِمْ فِي سَبِيلِ اللَّهِ وَالَّذِينَ آوَوْا وَنَصَرُوا أُولَئِكَ بَعْضُهُمْ أَوْلِيَاءُ بَعْضٍ﴾ الْآيَةَ.", "أسامة بن زيد|نزول جبريل بصورة دحية الكلبي": "أُنْبِئْتُ أَنَّ جِبْرِيلَ أَتَى النَّبِيَّ ﷺ وَعِنْدَهُ أُمُّ سَلَمَةَ، فَجَعَلَ يَتَحَدَّثُ، فَقَالَ النَّبِيُّ ﷺ لِأُمِّ سَلَمَةَ : «مَنْ هَذَا ؟»، أَوْ كَمَا قَالَ. قَالَتْ : هَذَا دِحْيَةُ. فَلَمَّا قَامَ قَالَتْ : وَاللَّهِ، مَا حَسِبْتُهُ إِلَّا إِيَّاهُ حَتَّى سَمِعْتُ خُطْبَةَ النَّبِيِّ ﷺ يُخْبِرُ خَبَرَ جِبْرِيلَ، أَوْ كَمَا قَالَ. قَالَ أَبِي : قُلْتُ لِأَبِي عُثْمَانَ : مِمَّنْ سَمِعْتَ هَذَا ؟ قَالَ : مِنْ أُسَامَةَ بْنِ زَيْدٍ.", "أسامة بن زيد|الحذر من الدخول في الفتنة بين المسلمين": "أَرْسَلَنِي أُسَامَةُ إِلَى عَلِيٍّ، وَقَالَ : إِنَّهُ سَيَسْأَلُكَ الْآنَ، فَيَقُولُ : مَا خَلَّفَ صَاحِبَكَ ؟ فَقُلْ لَهُ : يَقُولُ لَكَ : لَوْ كُنْتَ فِي شِدْقِ الْأَسَدِ لَأَحْبَبْتُ أَنْ أَكُونَ مَعَكَ فِيهِ، وَلَكِنَّ هَذَا أَمْرٌ لَمْ أَرَهُ. فَلَمْ يُعْطِنِي شَيْئًا، فَذَهَبْتُ إِلَى حَسَنٍ وَحُسَيْنٍ وَابْنِ جَعْفَرٍ، فَأَوْقَرُوا لِي رَاحِلَتِي.", "الأشعث بن قيس|وعيد من اقتطع مال مسلم بيمين": "قَالَ النَّبِيُّ ﷺ : «لَا يَحْلِفُ عَلَى يَمِينِ صَبْرٍ يَقْتَطِعُ مَالًا وَهُوَ فِيهَا فَاجِرٌ، إِلَّا لَقِيَ اللَّهَ وَهُوَ عَلَيْهِ غَضْبَانُ». فَأَنْزَلَ اللَّهُ : ﴿إِنَّ الَّذِينَ يَشْتَرُونَ بِعَهْدِ اللَّهِ﴾ الْآيَةَ. فَجَاءَ الْأَشْعَثُ وَعَبْدُ اللَّهِ يُحَدِّثُهُمْ، فَقَالَ : فِيَّ نَزَلَتْ، وَفِي رَجُلٍ خَاصَمْتُهُ فِي بِئْرٍ، فَقَالَ النَّبِيُّ ﷺ : «أَلَكَ بَيِّنَةٌ ؟». قُلْتُ : لَا. قَالَ : «فَلْيَحْلِفْ». قُلْتُ : إِذَنْ يَحْلِفَ. فَنَزَلَتْ : ﴿إِنَّ الَّذِينَ يَشْتَرُونَ بِعَهْدِ اللَّهِ﴾ الْآيَةَ.", "البراء بن عازب|ما يجزئ في الأضحية وسنها": "خَطَبَنَا رَسُولُ اللَّهِ ﷺ يَوْمَ النَّحْرِ بَعْدَ الصَّلَاةِ، فَقَالَ : مَنْ صَلَّى صَلَاتَنَا وَنَسَكَ نُسُكَنَا فَقَدْ أَصَابَ النُّسُكَ، وَمَنْ نَسَكَ قَبْلَ الصَّلَاةِ فَتِلْكَ شَاةُ لَحْمٍ. فَقَامَ أَبُو بُرْدَةَ بْنُ نِيَارٍ فَقَالَ : يَا رَسُولَ اللَّهِ، وَاللَّهِ لَقَدْ نَسَكْتُ قَبْلَ أَنْ أَخْرُجَ إِلَى الصَّلَاةِ، وَعَرَفْتُ أَنَّ الْيَوْمَ يَوْمُ أَكْلٍ وَشُرْبٍ فَتَعَجَّلْتُ، وَأَكَلْتُ، وَأَطْعَمْتُ أَهْلِي وَجِيرَانِي. فَقَالَ رَسُولُ اللَّهِ ﷺ : «تِلْكَ شَاةُ لَحْمٍ». قَالَ : فَإِنَّ عِنْدِي عَنَاقَ جَذَعَةٍ هِيَ خَيْرٌ مِنْ شَاتَيْ لَحْمٍ، فَهَلْ تَجْزِي عَنِّي ؟ قَالَ : «نَعَمْ، وَلَنْ تَجْزِيَ عَنْ أَحَدٍ بَعْدَكَ».", "البراء بن عازب|مقدار أركان الصلاة": "كَانَتْ صَلَاةُ رَسُولِ اللَّهِ ﷺ وَرُكُوعُهُ، وَإِذَا رَفَعَ رَأْسَهُ مِنَ الرُّكُوعِ، وَسُجُودُهُ، وَمَا بَيْنَ السَّجْدَتَيْنِ؛ قَرِيبًا مِنَ السَّوَاءِ.", "البراء بن عازب|شجاعة النبي ﷺ": "جَاءَ رَجُلٌ إِلَى الْبَرَاءِ، فَقَالَ : أَكُنْتُمْ وَلَّيْتُمْ يَوْمَ حُنَيْنٍ يَا أَبَا عُمَارَةَ ؟ فَقَالَ : أَشْهَدُ عَلَى نَبِيِّ اللَّهِ ﷺ مَا وَلَّى، وَلَكِنَّهُ انْطَلَقَ أَخِفَّاءُ مِنَ النَّاسِ، وَحُسَّرٌ إِلَى هَذَا الْحَيِّ مِنْ هَوَازِنَ وَهُمْ قَوْمٌ رُمَاةٌ، فَرَمَوْهُمْ بِرِشْقٍ مِنْ نَبْلٍ كَأَنَّهَا رِجْلٌ مِنْ جَرَادٍ، فَانْكَشَفُوا، فَأَقْبَلَ الْقَوْمُ إِلَى رَسُولِ اللَّهِ ﷺ وَأَبُو سُفْيَانَ بْنُ الْحَارِثِ يَقُودُ بِهِ بَغْلَتَهُ، فَنَزَلَ، وَدَعَا، وَاسْتَنْصَرَ، وَهُوَ يَقُولُ : «أَنَا النَّبِيُّ لَا كَذِبْ، أَنَا ابْنُ عَبْدِ الْمُطَّلِبْ، اللَّهُمَّ نَزِّلْ نَصْرَكَ». قَالَ الْبَرَاءُ : كُنَّا وَاللَّهِ إِذَا احْمَرَّ الْبَأْسُ نَتَّقِي بِهِ، وَإِنَّ الشُّجَاعَ مِنَّا لَلَّذِي يُحَاذِي بِهِ، يَعْنِي النَّبِيَّ ﷺ.", "البراء بن عازب|صلح الحديبية": "لَمَّا اعْتَمَرَ النَّبِيُّ ﷺ فِي ذِي الْقَعْدَةِ فَأَبَى أَهْلُ مَكَّةَ أَنْ يَدَعُوهُ يَدْخُلُ مَكَّةَ حَتَّى قَاضَاهُمْ عَلَى أَنْ يُقِيمَ بِهَا ثَلَاثَةَ أَيَّامٍ، فَلَمَّا كَتَبُوا الْكِتَابَ كَتَبُوا : هَذَا مَا قَاضَى عَلَيْهِ مُحَمَّدٌ رَسُولُ اللَّهِ. قَالُوا : لَا نُقِرُّ لَكَ بِهَذَا؛ لَوْ نَعْلَمُ أَنَّكَ رَسُولُ اللَّهِ مَا مَنَعْنَاكَ شَيْئًا، وَلَكِنْ أَنْتَ مُحَمَّدُ بْنُ عَبْدِ اللَّهِ. فَقَالَ : «أَنَا رَسُولُ اللَّهِ، وَأَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ». ثُمَّ قَالَ لِعَلِيٍّ رَضِيَ اللَّهُ عَنْهُ : «امْحُ رَسُولَ اللَّهِ». قَالَ عَلِيٌّ : لَا وَاللَّهِ، لَا أَمْحُوكَ أَبَدًا. فَأَخَذَ رَسُولُ اللَّهِ ﷺ الْكِتَابَ وَلَيْسَ يُحْسِنُ يَكْتُبُ، فَكَتَبَ : «هَذَا مَا قَاضَى مُحَمَّدُ بْنُ عَبْدِ اللَّهِ؛ لَا يُدْخِلُ مَكَّةَ السِّلَاحَ إِلَّا السَّيْفَ فِي الْقِرَابِ، وَأَنْ لَا يَخْرُجَ مِنْ أَهْلِهَا بِأَحَدٍ إِنْ أَرَادَ أَنْ يَتْبَعَهُ، وَأَنْ لَا يَمْنَعَ مِنْ أَصْحَابِهِ أَحَدًا إِنْ أَرَادَ أَنْ يُقِيمَ بِهَا». فَلَمَّا دَخَلَهَا، وَمَضَى الْأَجَلُ أَتَوْا عَلِيًّا، فَقَالُوا : قُلْ لِصَاحِبِكَ : اخْرُجْ عَنَّا فَقَدْ مَضَى الْأَجَلُ. فَخَرَجَ النَّبِيُّ ﷺ، فَتَبِعَتْهُ ابْنَةُ حَمْزَةَ تُنَادِي : يَا عَمِّ، يَا عَمِّ، فَتَنَاوَلَهَا عَلِيٌّ، فَأَخَذَ بِيَدِهَا، وَقَالَ لِفَاطِمَةَ رَضِيَ اللَّهُ عَنْهَا : دُونَكِ ابْنَةَ عَمِّكِ. حَمَلَتْهَا، فَاخْتَصَمَ فِيهَا عَلِيٌّ، وَزَيْدٌ، وَجَعْفَرٌ، قَالَ عَلِيٌّ : أَنَا أَخَذْتُهَا وَهِيَ بِنْتُ عَمِّي. وَقَالَ جَعْفَرٌ : ابْنَةُ عَمِّي وَخَالَتُهَا تَحْتِي. وَقَالَ زَيْدٌ : ابْنَةُ أَخِي. فَقَضَى بِهَا النَّبِيُّ ﷺ لِخَالَتِهَا، وَقَالَ : «الْخَالَةُ بِمَنْزِلَةِ الْأُمِّ». وَقَالَ لِعَلِيٍّ : «أَنْتَ مِنِّي، وَأَنَا مِنْكَ». وَقَالَ لِجَعْفَرٍ : «أَشْبَهْتَ خَلْقِي، وَخُلُقِي». وَقَالَ لِزَيْدٍ : «أَنْتَ أَخُونَا وَمَوْلَانَا». وَقَالَ عَلِيٌّ : أَلَا تَتَزَوَّجُ بِنْتَ حَمْزَةَ ؟ قَالَ : «إِنَّهَا ابْنَةُ أَخِي مِنَ الرَّضَاعَةِ».", "البراء بن عازب|وأتوا البيوت من أبوابها": "نَزَلَتْ هَذِهِ الْآيَةُ فِينَا؛ كَانَتِ الْأَنْصَارُ إِذَا حَجُّوا فَجَاءُوا لَمْ يَدْخُلُوا مِنْ قِبَلِ أَبْوَابِ بُيُوتِهِمْ، وَلَكِنْ مِنْ ظُهُورِهَا، فَجَاءَ رَجُلٌ مِنَ الْأَنْصَارِ فَدَخَلَ مِنْ قِبَلِ بَابِهِ، فَكَأَنَّهُ عُيِّرَ بِذَلِكَ؛ فَنَزَلَتْ : ﴿وَلَيْسَ الْبِرُّ بِأَنْ تَأْتُوا الْبُيُوتَ مِنْ ظُهُورِهَا وَلَكِنَّ الْبِرَّ مَنِ اتَّقَى وَأْتُوا الْبُيُوتَ مِنْ أَبْوَابِهَا﴾.", "البراء بن عازب|حفر الخندق": "رَأَيْتُ النَّبِيَّ ﷺ يَوْمَ الْخَنْدَقِ وَهُوَ يَنْقُلُ التُّرَابَ، حَتَّى وَارَى التُّرَابُ شَعَرَ صَدْرِهِ، وَكَانَ رَجُلًا كَثِيرَ الشَّعَرِ، وَهُوَ يَرْتَجِزُ بِرَجَزِ عَبْدِ اللَّهِ : اللَّهُمَّ لَوْلَا أَنْتَ مَا اهْتَدَيْنَا وَلَا تَصَدَّقْنَا وَلَا صَلَّيْنَا فَأَنْزِلَنْ سَكِينَةً عَلَيْنَا وَثَبِّتِ الْأَقْدَامَ إِنْ لَاقَيْنَا إِنَّ الْأَعْدَاءَ قَدْ بَغَوْا عَلَيْنَا إِذَا أَرَادُوا فِتْنَةً أَبَيْنَا يَرْفَعُ بِهَا صَوْتَهُ.", "البراء بن عازب|لا يستوي القاعدون من المؤمنين": "لَمَّا نَزَلَتْ : ﴿لَا يَسْتَوِي الْقَاعِدُونَ مِنَ الْمُؤْمِنِينَ﴾. قَالَ النَّبِيُّ ﷺ : «ادْعُوا فُلَانًا». فَجَاءَهُ وَمَعَهُ الدَّوَاةُ وَاللَّوْحُ، أَوِ الْكَتِفُ، فَقَالَ : «اكْتُبْ : (لَا يَسْتَوِي الْقَاعِدُونَ مِنَ الْمُؤْمِنِينَ وَالْمُجَاهِدُونَ فِي سَبِيلِ اللَّهِ)». وَخَلْفَ النَّبِيِّ ﷺ ابْنُ أُمِّ مَكْتُومٍ، فَقَالَ : يَا رَسُولَ اللَّهِ، أَنَا ضَرِيرٌ. فَنَزَلَتْ مَكَانَهَا : ﴿لَا يَسْتَوِي الْقَاعِدُونَ مِنَ الْمُؤْمِنِينَ غَيْرُ أُولِي الضَّرَرِ وَالْمُجَاهِدُونَ فِي سَبِيلِ اللَّهِ﴾.", "البراء بن عازب|تحويل القبلة": "كَانَ رَسُولُ اللَّهِ ﷺ صَلَّى نَحْوَ بَيْتِ الْمَقْدِسِ سِتَّةَ عَشَرَ أَوْ سَبْعَةَ عَشَرَ شَهْرًا، وَكَانَ رَسُولُ اللَّهِ ﷺ يُحِبُّ أَنْ يُوَجَّهَ إِلَى الْكَعْبَةِ، فَأَنْزَلَ اللَّهُ : ﴿قَدْ نَرَى تَقَلُّبَ وَجْهِكَ فِي السَّمَاءِ﴾ فَتَوَجَّهَ نَحْوَ الْكَعْبَةِ، وَقَالَ السُّفَهَاءُ مِنَ النَّاسِ، وَهُمُ الْيَهُودُ : ﴿مَا وَلَّاهُمْ عَنْ قِبْلَتِهِمُ الَّتِي كَانُوا عَلَيْهَا قُلْ لِلَّهِ الْمَشْرِقُ وَالْمَغْرِبُ يَهْدِي مَنْ يَشَاءُ إِلَى صِرَاطٍ مُسْتَقِيمٍ﴾ فَصَلَّى مَعَ النَّبِيِّ ﷺ رَجُلٌ، ثُمَّ خَرَجَ بَعْدَمَا صَلَّى فَمَرَّ عَلَى قَوْمٍ مِنَ الْأَنْصَارِ فِي صَلَاةِ الْعَصْرِ نَحْوَ بَيْتِ الْمَقْدِسِ، فَقَالَ : هُوَ يَشْهَدُ أَنَّهُ صَلَّى مَعَ رَسُولِ اللَّهِ ﷺ، وَأَنَّهُ تَوَجَّهَ نَحْوَ الْكَعْبَةِ فَتَحَرَّفَ الْقَوْمُ، حَتَّى تَوَجَّهُوا نَحْوَ الْكَعْبَةِ.", "البراء بن عازب|الصلاة الوسطى صلاة العصر": "نَزَلَتْ هَذِهِ الْآيَةُ : ( حَافِظُوا عَلَى الصَّلَوَاتِ وَصَلَاةِ الْعَصْرِ )، فَقَرَأْنَاهَا مَا شَاءَ اللَّهُ، ثُمَّ نَسَخَهَا اللَّهُ فَنَزَلَتْ : ﴿حَافِظُوا عَلَى الصَّلَوَاتِ وَالصَّلَاةِ الْوُسْطَى﴾. فَقَالَ رَجُلٌ كَانَ جَالِسًا عِنْدَ شَقِيقٍ لَهُ : هِيَ إِذَنْ صَلَاةُ الْعَصْرِ. فَقَالَ الْبَرَاءُ : قَدْ أَخْبَرْتُكَ كَيْفَ نَزَلَتْ وَكَيْفَ نَسَخَهَا اللَّهُ، وَاللَّهُ أَعْلَمُ.", "البراء بن عازب|وجوب الحكم بما أنزل الله": "مُرَّ عَلَى النَّبِيِّ ﷺ بِيَهُودِيٍّ مُحَمَّمًا مَجْلُودًا، فَدَعَاهُمْ ﷺ، فَقَالَ : «هَكَذَا تَجِدُونَ حَدَّ الزَّانِي فِي كِتَابِكُمْ ؟». قَالُوا : نَعَمْ. فَدَعَا رَجُلًا مِنْ عُلَمَائِهِمْ، فَقَالَ : «أَنْشُدُكَ بِاللَّهِ الَّذِي أَنْزَلَ التَّوْرَاةَ عَلَى مُوسَى أَهَكَذَا تَجِدُونَ حَدَّ الزَّانِي فِي كِتَابِكُمْ ؟». قَالَ : لَا، وَلَوْلَا أَنَّكَ نَشَدْتَنِي بِهَذَا لَمْ أُخْبِرْكَ، نَجِدُهُ الرَّجْمَ، وَلَكِنَّهُ كَثُرَ فِي أَشْرَافِنَا؛ فَكُنَّا إِذَا أَخَذْنَا الشَّرِيفَ تَرَكْنَاهُ، وَإِذَا أَخَذْنَا الضَّعِيفَ أَقَمْنَا عَلَيْهِ الْحَدَّ. قُلْنَا : تَعَالَوْا فَلْنَجْتَمِعْ عَلَى شَيْءٍ نُقِيمُهُ عَلَى الشَّرِيفِ وَالْوَضِيعِ، فَجَعَلْنَا التَّحْمِيمَ وَالْجَلْدَ مَكَانَ الرَّجْمِ. فَقَالَ رَسُولُ اللَّهِ ﷺ : «اللَّهُمَّ إِنِّي أَوَّلُ مَنْ أَحْيَا أَمْرَكَ؛ إِذْ أَمَاتُوهُ». فَأَمَرَ بِهِ، فَرُجِمَ، فَأَنْزَلَ اللَّهُ عَزَّ وَجَلَّ : ﴿يَا أَيُّهَا الرَّسُولُ لَا يَحْزُنْكَ الَّذِينَ يُسَارِعُونَ فِي الْكُفْرِ﴾ إِلَى قَوْلِهِ : ﴿إِنْ أُوتِيتُمْ هَذَا فَخُذُوهُ﴾ يَقُولُ : ائْتُوا مُحَمَّدًا ﷺ، فَإِنْ أَمَرَكُمْ بِالتَّحْمِيمِ وَالْجَلْدِ فَخُذُوهُ، وَإِنْ أَفْتَاكُمْ بِالرَّجْمِ فَاحْذَرُوا. فَأَنْزَلَ اللَّهُ تَعَالَى : ﴿وَمَنْ لَمْ يَحْكُمْ بِمَا أَنْزَلَ اللَّهُ فَأُولَئِكَ هُمُ الْكَافِرُونَ﴾، ﴿وَمَنْ لَمْ يَحْكُمْ بِمَا أَنْزَلَ اللَّهُ فَأُولَئِكَ هُمُ الظَّالِمُونَ﴾، ﴿وَمَنْ لَمْ يَحْكُمْ بِمَا أَنْزَلَ اللَّهُ فَأُولَئِكَ هُمُ الْفَاسِقُونَ﴾ فِي الْكُفَّارِ كُلُّهَا.", "البراء بن عازب|نزول: وكلوا واشربوا حتى يتبين لكم الخيط الأبيض": "كَانَ أَصْحَابُ مُحَمَّدٍ ﷺ إِذَا كَانَ الرَّجُلُ صَائِمًا فَحَضَرَ الْإِفْطَارُ فَنَامَ قَبْلَ أَنْ يُفْطِرَ، لَمْ يَأْكُلْ لَيْلَتَهُ وَلَا يَوْمَهُ حَتَّى يُمْسِيَ، وَإِنَّ قَيْسَ بْنَ صِرْمَةَ الْأَنْصَارِيَّ كَانَ صَائِمًا، فَلَمَّا حَضَرَ الْإِفْطَارُ أَتَى امْرَأَتَهُ فَقَالَ لَهَا : أَعِنْدَكِ طَعَامٌ ؟ قَالَتْ : لَا، وَلَكِنْ أَنْطَلِقُ فَأَطْلُبُ لَكَ. وَكَانَ يَوْمَهُ يَعْمَلُ فَغَلَبَتْهُ عَيْنَاهُ، فَجَاءَتْهُ امْرَأَتُهُ، فَلَمَّا رَأَتْهُ قَالَتْ : خَيْبَةً لَكَ. فَلَمَّا انْتَصَفَ النَّهَارُ غُشِيَ عَلَيْهِ، فَذُكِرَ ذَلِكَ لِلنَّبِيِّ ﷺ، فَنَزَلَتْ هَذِهِ الْآيَةُ : ﴿أُحِلَّ لَكُمْ لَيْلَةَ الصِّيَامِ الرَّفَثُ إِلَى نِسَائِكُمْ﴾ فَفَرِحُوا بِهَا فَرَحًا شَدِيدًا، وَنَزَلَتْ : ﴿وَكُلُوا وَاشْرَبُوا حَتَّى يَتَبَيَّنَ لَكُمُ الْخَيْطُ الْأَبْيَضُ مِنَ الْخَيْطِ الْأَسْوَدِ﴾.", "البراء بن عازب|نزول: علم الله أنكم كنتم تختانون أنفسكم": "لَمَّا نَزَلَ صَوْمُ رَمَضَانَ كَانُوا لَا يَقْرَبُونَ النِّسَاءَ رَمَضَانَ كُلَّهُ، وَكَانَ رِجَالٌ يَخُونُونَ أَنْفُسَهُمْ، فَأَنْزَلَ اللَّهُ : ﴿عَلِمَ اللَّهُ أَنَّكُمْ كُنْتُمْ تَخْتَانُونَ أَنْفُسَكُمْ فَتَابَ عَلَيْكُمْ وَعَفَا عَنْكُمْ﴾.", "البراء بن عازب|غزوة الحديبية وعلامة النبوة": "تَعُدُّونَ أَنْتُمُ الْفَتْحَ فَتْحَ مَكَّةَ، وَقَدْ كَانَ فَتْحُ مَكَّةَ فَتْحًا، وَنَحْنُ نَعُدُّ الْفَتْحَ بَيْعَةَ الرِّضْوَانِ يَوْمَ الْحُدَيْبِيَةِ؛ كُنَّا مَعَ النَّبِيِّ ﷺ أَرْبَعَ عَشْرَةَ مِائَةً، وَالْحُدَيْبِيَةُ بِئْرٌ، فَنَزَحْنَاهَا، فَلَمْ نَتْرُكْ فِيهَا قَطْرَةً، فَبَلَغَ ذَلِكَ النَّبِيَّ ﷺ، فَأَتَاهَا، فَجَلَسَ عَلَى شَفِيرِهَا، ثُمَّ دَعَا بِإِنَاءٍ مِنْ مَاءٍ، فَتَوَضَّأَ، ثُمَّ مَضْمَضَ، وَدَعَا، ثُمَّ صَبَّهُ فِيهَا، فَتَرَكْنَاهَا غَيْرَ بَعِيدٍ، ثُمَّ إِنَّهَا أَصْدَرَتْنَا مَا شِئْنَا نَحْنُ، وَرِكَابَنَا.", "البراء بن عازب|مقدم النبي ﷺ وأصحابه المدينة": "أَوَّلُ مَنْ قَدِمَ عَلَيْنَا مُصْعَبُ بْنُ عُمَيْرٍ، وَابْنُ أُمِّ مَكْتُومٍ وَكَانَا يُقْرِئَانِ النَّاسَ، فَقَدِمَ بِلَالٌ، وَسَعْدٌ، وَعَمَّارُ بْنُ يَاسِرٍ، ثُمَّ قَدِمَ عُمَرُ بْنُ الْخَطَّابِ فِي عِشْرِينَ مِنْ أَصْحَابِ النَّبِيِّ ﷺ، ثُمَّ قَدِمَ النَّبِيُّ ﷺ فَمَا رَأَيْتُ أَهْلَ الْمَدِينَةِ فَرِحُوا بِشَيْءٍ فَرَحَهُمْ بِرَسُولِ اللَّهِ ﷺ، حَتَّى جَعَلَ الْإِمَاءُ يَقُلْنَ : قَدِمَ رَسُولُ اللَّهِ ﷺ. فَمَا قَدِمَ حَتَّى قَرَأْتُ : ﴿سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى﴾ فِي سُوَرٍ مِنَ الْمُفَصَّلِ.", "البراء بن عازب|تحريم الخروج عن أمر الأمير في الحرب": "جَعَلَ النَّبِيُّ ﷺ عَلَى الرَّجَّالَةِ يَوْمَ أُحُدٍ - وَكَانُوا خَمْسِينَ رَجُلًا - عَبْدَ اللَّهِ بْنَ جُبَيْرٍ، فَقَالَ : «إِنْ رَأَيْتُمُونَا تَخْطَفُنَا الطَّيْرُ فَلَا تَبْرَحُوا مَكَانَكُمْ هَذَا حَتَّى أُرْسِلَ إِلَيْكُمْ، وَإِنْ رَأَيْتُمُونَا هَزَمْنَا الْقَوْمَ وَأَوْطَأْنَاهُمْ فَلَا تَبْرَحُوا حَتَّى أُرْسِلَ إِلَيْكُمْ». فَهَزَمُوهُمْ، قَالَ : فَأَنَا وَاللَّهِ رَأَيْتُ النِّسَاءَ يَشْتَدِدْنَ قَدْ بَدَتْ خَلَاخِلُهُنَّ وَأَسْوُقُهُنَّ، رَافِعَاتٍ ثِيَابَهُنَّ، فَقَالَ أَصْحَابُ عَبْدِ اللَّهِ بْنِ جُبَيْرٍ : الْغَنِيمَةَ، أَيْ قَوْمِ، الْغَنِيمَةَ، ظَهَرَ أَصْحَابُكُمْ فَمَا تَنْتَظِرُونَ ؟ فَقَالَ عَبْدُ اللَّهِ بْنُ جُبَيْرٍ : أَنَسِيتُمْ مَا قَالَ لَكُمْ رَسُولُ اللَّهِ ﷺ ؟ قَالُوا : وَاللَّهِ لَنَأْتِيَنَّ النَّاسَ فَلَنُصِيبَنَّ مِنَ الْغَنِيمَةِ. فَلَمَّا أَتَوْهُمْ صُرِفَتْ وُجُوهُهُمْ فَأَقْبَلُوا مُنْهَزِمِينَ، فَذَاكَ إِذْ يَدْعُوهُمُ الرَّسُولُ فِي أُخْرَاهُمْ، فَلَمْ يَبْقَ مَعَ النَّبِيِّ ﷺ غَيْرُ اثْنَيْ عَشَرَ رَجُلًا، فَأَصَابُوا مِنَّا سَبْعِينَ، وَكَانَ النَّبِيُّ ﷺ وَأَصْحَابُهُ أَصَابَ مِنَ الْمُشْرِكِينَ يَوْمَ بَدْرٍ أَرْبَعِينَ وَمِائَةً؛ سَبْعِينَ أَسِيرًا وَسَبْعِينَ قَتِيلًا، فَقَالَ أَبُو سُفْيَانَ : أَفِي الْقَوْمِ مُحَمَّدٌ ؟ ثَلَاثَ مَرَّاتٍ، فَنَهَاهُمُ النَّبِيُّ ﷺ أَنْ يُجِيبُوهُ، ثُمَّ قَالَ : أَفِي الْقَوْمِ ابْنُ أَبِي قُحَافَةَ ؟ ثَلَاثَ مَرَّاتٍ، ثُمَّ قَالَ : أَفِي الْقَوْمِ ابْنُ الْخَطَّابِ ؟ ثَلَاثَ مَرَّاتٍ، ثُمَّ رَجَعَ إِلَى أَصْحَابِهِ فَقَالَ : أَمَّا هَؤُلَاءِ فَقَدْ قُتِلُوا. فَمَا مَلَكَ عُمَرُ نَفْسَهُ فَقَالَ : كَذَبْتَ وَاللَّهِ يَا عَدُوَّ اللَّهِ، إِنَّ الَّذِينَ عَدَدْتَ لَأَحْيَاءٌ كُلُّهُمْ، وَقَدْ بَقِيَ لَكَ مَا يَسُوءُكَ. قَالَ : يَوْمٌ بِيَوْمِ بَدْرٍ، وَالْحَرْبُ سِجَالٌ، إِنَّكُمْ سَتَجِدُونَ فِي الْقَوْمِ مُثْلَةً لَمْ آمُرْ بِهَا وَلَمْ تَسُؤْنِي، ثُمَّ أَخَذَ يَرْتَجِزُ : أُعْلُ هُبَلْ، أُعْلُ هُبَلْ، قَالَ النَّبِيُّ ﷺ : «أَلَا تُجِيبُوا لَهُ». قَالُوا : يَا رَسُولَ اللَّهِ، مَا نَقُولُ ؟ قَالَ : «قُولُوا : اللَّهُ أَعْلَى وَأَجَلُّ». قَالَ : إِنَّ لَنَا الْعُزَّى وَلَا عُزَّى لَكُمْ، فَقَالَ النَّبِيُّ ﷺ : «أَلَا تُجِيبُوا لَهُ». قَالَ : قَالُوا : يَا رَسُولَ اللَّهِ، مَا نَقُولُ ؟ قَالَ : «قُولُوا : اللَّهُ مَوْلَانَا وَلَا مَوْلَى لَكُمْ».", "البراء بن عازب|قصة مقتل أبي رافع اليهودي": "بَعَثَ رَسُولُ اللَّهِ ﷺ إِلَى أَبِي رَافِعٍ الْيَهُودِيِّ رِجَالًا مِنَ الْأَنْصَارِ، فَأَمَّرَ عَلَيْهِمْ عَبْدَ اللَّهِ بْنَ عَتِيكٍ، وَكَانَ أَبُو رَافِعٍ يُؤْذِي رَسُولَ اللَّهِ ﷺ، وَيُعِينُ عَلَيْهِ، وَكَانَ فِي حِصْنٍ لَهُ بِأَرْضِ الْحِجَازِ، فَلَمَّا دَنَوْا مِنْهُ وَقَدْ غَرَبَتِ الشَّمْسُ، وَرَاحَ النَّاسُ بِسَرْحِهِمْ، فَقَالَ عَبْدُ اللَّهِ لِأَصْحَابِهِ : اجْلِسُوا مَكَانَكُمْ؛ فَإِنِّي مُنْطَلِقٌ، وَمُتَلَطِّفٌ لِلْبَوَّابِ لَعَلِّي أَنْ أَدْخُلَ. فَأَقْبَلَ حَتَّى دَنَا مِنَ الْبَابِ، ثُمَّ تَقَنَّعَ بِثَوْبِهِ كَأَنَّهُ يَقْضِي حَاجَةً، وَقَدْ دَخَلَ النَّاسُ فَهَتَفَ بِهِ الْبَوَّابُ : يَا عَبْدَ اللَّهِ، إِنْ كُنْتَ تُرِيدُ أَنْ تَدْخُلَ فَادْخُلْ؛ فَإِنِّي أُرِيدُ أَنْ أُغْلِقَ الْبَابَ. فَدَخَلْتُ، فَكَمَنْتُ، فَلَمَّا دَخَلَ النَّاسُ أَغْلَقَ الْبَابَ، ثُمَّ عَلَّقَ الْأَغَالِيقَ عَلَى وَتَدٍ. قَالَ : فَقُمْتُ إِلَى الْأَقَالِيدِ، فَأَخَذْتُهَا، فَفَتَحْتُ الْبَابَ، وَكَانَ أَبُو رَافِعٍ يُسْمَرُ عِنْدَهُ، وَكَانَ فِي عَلَالِيَّ لَهُ، فَلَمَّا ذَهَبَ عَنْهُ أَهْلُ سَمَرِهِ صَعِدْتُ إِلَيْهِ، فَجَعَلْتُ كُلَّمَا فَتَحْتُ بَابًا أَغْلَقْتُ عَلَيَّ مِنْ دَاخِلٍ. قُلْتُ : إِنِ الْقَوْمُ نَذِرُوا بِي لَمْ يَخْلُصُوا إِلَيَّ حَتَّى أَقْتُلَهُ. فَانْتَهَيْتُ إِلَيْهِ فَإِذَا هُوَ فِي بَيْتٍ مُظْلِمٍ وَسْطَ عِيَالِهِ لَا أَدْرِي أَيْنَ هُوَ مِنَ الْبَيْتِ، فَقُلْتُ : يَا أَبَا رَافِعٍ. قَالَ : مَنْ هَذَا ؟ فَأَهْوَيْتُ نَحْوَ الصَّوْتِ فَأَضْرِبُهُ ضَرْبَةً بِالسَّيْفِ وَأَنَا دَهِشٌ، فَمَا أَغْنَيْتُ شَيْئًا، وَصَاحَ، فَخَرَجْتُ مِنَ الْبَيْتِ، فَأَمْكُثُ غَيْرَ بَعِيدٍ، ثُمَّ دَخَلْتُ إِلَيْهِ، فَقُلْتُ : مَا هَذَا الصَّوْتُ يَا أَبَا رَافِعٍ ؟ فَقَالَ : لِأُمِّكَ الْوَيْلُ، إِنَّ رَجُلًا فِي الْبَيْتِ ضَرَبَنِي قَبْلُ بِالسَّيْفِ. قَالَ : فَأَضْرِبُهُ ضَرْبَةً أَثْخَنَتْهُ، وَلَمْ أَقْتُلْهُ، ثُمَّ وَضَعْتُ ظُبَةَ السَّيْفِ فِي بَطْنِهِ، حَتَّى أَخَذَ فِي ظَهْرِهِ، فَعَرَفْتُ أَنِّي قَتَلْتُهُ، فَجَعَلْتُ أَفْتَحُ الْأَبْوَابَ بَابًا بَابًا حَتَّى انْتَهَيْتُ إِلَى دَرَجَةٍ لَهُ، فَوَضَعْتُ رِجْلِي وَأَنَا أُرَى أَنِّي قَدِ انْتَهَيْتُ إِلَى الْأَرْضِ، فَوَقَعْتُ فِي لَيْلَةٍ مُقْمِرَةٍ، فَانْكَسَرَتْ سَاقِي، فَعَصَبْتُهَا بِعِمَامَةٍ، ثُمَّ انْطَلَقْتُ حَتَّى جَلَسْتُ عَلَى الْبَابِ، فَقُلْتُ : لَا أَخْرُجُ اللَّيْلَةَ حَتَّى أَعْلَمَ أَقَتَلْتُهُ ؟ فَلَمَّا صَاحَ الدِّيكُ قَامَ النَّاعِي عَلَى السُّورِ، فَقَالَ : أَنْعَى أَبَا رَافِعٍ تَاجِرَ أَهْلِ الْحِجَازِ. فَانْطَلَقْتُ إِلَى أَصْحَابِي، فَقُلْتُ : النَّجَاءَ؛ فَقَدْ قَتَلَ اللَّهُ أَبَا رَافِعٍ. فَانْتَهَيْتُ إِلَى النَّبِيِّ ﷺ، فَحَدَّثْتُهُ، فَقَالَ : «ابْسُطْ رِجْلَكَ». فَبَسَطْتُ رِجْلِي، فَمَسَحَهَا، فَكَأَنَّهَا لَمْ أَشْتَكِهَا قَطُّ.", "البراء بن عازب|الحث على التوبة إلى الله": "قَالَ رَسُولُ اللَّهِ ﷺ : «كَيْفَ تَقُولُونَ بِفَرَحِ رَجُلٍ انْفَلَتَتْ مِنْهُ رَاحِلَتُهُ، تَجُرُّ زِمَامَهَا بِأَرْضٍ قَفْرٍ لَيْسَ بِهَا طَعَامٌ وَلَا شَرَابٌ، وَعَلَيْهَا لَهُ طَعَامٌ وَشَرَابٌ، فَطَلَبَهَا حَتَّى شَقَّ عَلَيْهِ، ثُمَّ مَرَّتْ بِجِذْلِ شَجَرَةٍ فَتَعَلَّقَ زِمَامُهَا، فَوَجَدَهَا مُتَعَلِّقَةً بِهِ ؟». قُلْنَا : شَدِيدًا يَا رَسُولَ اللَّهِ. فَقَالَ رَسُولُ اللَّهِ ﷺ : «أَمَا وَاللَّهِ لَلَّهُ أَشَدُّ فَرَحًا بِتَوْبَةِ عَبْدِهِ مِنَ الرَّجُلِ بِرَاحِلَتِهِ».", "البراء بن عازب|الذكر بعد الصلاة والوقوف يمين الصف": "كُنَّا إِذَا صَلَّيْنَا خَلْفَ رَسُولِ اللَّهِ ﷺ أَحْبَبْنَا أَنْ نَكُونَ عَنْ يَمِينِهِ يُقْبِلُ عَلَيْنَا بِوَجْهِهِ. قَالَ : فَسَمِعْتُهُ يَقُولُ : «رَبِّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ - أَوْ : تَجْمَعُ - عِبَادَكَ».", "البراء بن عازب|بعث علي وخالد إلى اليمن": "بَعَثَنَا رَسُولُ اللَّهِ ﷺ مَعَ خَالِدِ بْنِ الْوَلِيدِ إِلَى الْيَمَنِ، قَالَ : ثُمَّ بَعَثَ عَلِيًّا بَعْدَ ذَلِكَ مَكَانَهُ، فَقَالَ : «مُرْ أَصْحَابَ خَالِدٍ مَنْ شَاءَ مِنْهُمْ أَنْ يُعَقِّبَ مَعَكَ فَلْيُعَقِّبْ، وَمَنْ شَاءَ فَلْيُقْبِلْ». فَكُنْتُ فِيمَنْ عَقَّبَ مَعَهُ، قَالَ : فَغَنِمْتُ أَوَاقٍ ذَوَاتِ عَدَدٍ.", "البراء بن عازب|عدة المهاجرين والأنصار يوم بدر": "اسْتُصْغِرْتُ أَنَا، وَابْنُ عُمَرَ يَوْمَ بَدْرٍ، وَكَانَ الْمُهَاجِرُونَ يَوْمَ بَدْرٍ نَيِّفًا عَلَى سِتِّينَ، وَالْأَنْصَارُ نَيِّفًا وَأَرْبَعِينَ وَمِائَتَيْنِ.", "البراء بن عازب|فضل علي": "سَأَلَ رَجُلٌ الْبَرَاءَ وَأَنَا أَسْمَعُ، قَالَ : أَشَهِدَ عَلِيٌّ بَدْرًا ؟ قَالَ : بَارَزَ، وَظَاهَرَ.", "أبي بن كعب|فتنة المال": "كُنَّا نَرَى هَذَا مِنَ الْقُرْآنِ حَتَّى نَزَلَتْ : ﴿أَلْهَاكُمُ التَّكَاثُرُ﴾. يعني حديث: «لَوْ أَنَّ لِابْنِ آدَمَ وَادِيًا مِنْ ذَهَبٍ...» الحديث.", "أبي بن كعب|من الشعر حكمة": "إِنَّ مِنَ الشِّعْرِ حِكْمَةً.", "أبي بن كعب|أنزل القرآن على سبعة أحرف": "كُنْتُ فِي الْمَسْجِدِ، فَدَخَلَ رَجُلٌ يُصَلِّي، فَقَرَأَ قِرَاءَةً أَنْكَرْتُهَا عَلَيْهِ، ثُمَّ دَخَلَ آخَرُ فَقَرَأَ قِرَاءَةً سِوَى قِرَاءَةِ صَاحِبِهِ، فَلَمَّا قَضَيْنَا الصَّلَاةَ دَخَلْنَا جَمِيعًا عَلَى رَسُولِ اللَّهِ ﷺ، فَقُلْتُ : إِنَّ هَذَا قَرَأَ قِرَاءَةً أَنْكَرْتُهَا عَلَيْهِ، وَدَخَلَ آخَرُ فَقَرَأَ سِوَى قِرَاءَةِ صَاحِبِهِ. فَأَمَرَهُمَا رَسُولُ اللَّهِ ﷺ فَقَرَآ، فَحَسَّنَ النَّبِيُّ ﷺ شَأْنَهُمَا، فَسَقَطَ فِي نَفْسِي مِنَ التَّكْذِيبِ وَلَا إِذْ كُنْتُ فِي الْجَاهِلِيَّةِ، فَلَمَّا رَأَى رَسُولُ اللَّهِ ﷺ مَا قَدْ غَشِيَنِي ضَرَبَ فِي صَدْرِي، فَفِضْتُ عَرَقًا وَكَأَنَّمَا أَنْظُرُ إِلَى اللَّهِ عَزَّ وَجَلَّ فَرَقًا، فَقَالَ لِي : «يَا أُبَيُّ، أُرْسِلَ إِلَيَّ أَنِ اقْرَأِ الْقُرْآنَ عَلَى حَرْفٍ، فَرَدَدْتُ إِلَيْهِ أَنْ هَوِّنْ عَلَى أُمَّتِي، فَرَدَّ إِلَيَّ الثَّانِيَةَ : اقْرَأْهُ عَلَى حَرْفَيْنِ، فَرَدَدْتُ إِلَيْهِ أَنْ هَوِّنْ عَلَى أُمَّتِي، فَرَدَّ إِلَيَّ الثَّالِثَةَ : اقْرَأْهُ عَلَى سَبْعَةِ أَحْرُفٍ، فَلَكَ بِكُلِّ رَدَّةٍ رَدَدْتُكَهَا مَسْأَلَةٌ تَسْأَلُنِيهَا، فَقُلْتُ : اللَّهُمَّ اغْفِرْ لِأُمَّتِي، اللَّهُمَّ اغْفِرْ لِأُمَّتِي، وَأَخَّرْتُ الثَّالِثَةَ لِيَوْمٍ يَرْغَبُ إِلَيَّ الْخَلْقُ كُلُّهُمْ حَتَّى إِبْرَاهِيمُ ﷺ».", "أبي بن كعب|فضل كثرة الخطا إلى المساجد": "كَانَ رَجُلٌ لَا أَعْلَمُ رَجُلًا أَبْعَدَ مِنَ الْمَسْجِدِ مِنْهُ، وَكَانَ لَا تُخْطِئُهُ صَلَاةٌ. قَالَ : فَقِيلَ لَهُ - أَوْ : قُلْتُ لَهُ - : لَوِ اشْتَرَيْتَ حِمَارًا تَرْكَبُهُ فِي الظَّلْمَاءِ وَفِي الرَّمْضَاءِ. قَالَ : مَا يَسُرُّنِي أَنَّ مَنْزِلِي إِلَى جَنْبِ الْمَسْجِدِ؛ إِنِّي أُرِيدُ أَنْ يُكْتَبَ لِي مَمْشَايَ إِلَى الْمَسْجِدِ وَرُجُوعِي إِذَا رَجَعْتُ إِلَى أَهْلِي. فَقَالَ رَسُولُ اللَّهِ ﷺ : «قَدْ جَمَعَ اللَّهُ لَكَ ذَلِكَ كُلَّهُ».", "أبي بن كعب|تفسير: ولنذيقنهم من العذاب الأدنى": "فِي قَوْلِهِ عَزَّ وَجَلَّ : ﴿وَلَنُذِيقَنَّهُمْ مِنَ الْعَذَابِ الْأَدْنَى دُونَ الْعَذَابِ الْأَكْبَرِ﴾. قَالَ : مَصَائِبُ الدُّنْيَا، وَالرُّومُ، وَالْبَطْشَةُ، أَوِ الدُّخَانُ. شُعْبَةُ الشَّاكُّ فِي الْبَطْشَةِ أَوِ الدُّخَانِ.", "أسيد بن حضير|نزول الملائكة والسكينة عند قراءة القرآن": "بَيْنَمَا هُوَ يَقْرَأُ مِنَ اللَّيْلِ سُورَةَ الْبَقَرَةِ وَفَرَسُهُ مَرْبُوطَةٌ عِنْدَهُ إِذْ جَالَتِ الْفَرَسُ، فَسَكَتَ، فَسَكَتَتْ، فَقَرَأَ، فَجَالَتِ الْفَرَسُ، فَسَكَتَ، وَسَكَتَتِ الْفَرَسُ، ثُمَّ قَرَأَ، فَجَالَتِ الْفَرَسُ، فَانْصَرَفَ وَكَانَ ابْنُهُ يَحْيَى قَرِيبًا مِنْهَا، فَأَشْفَقَ أَنْ تُصِيبَهُ، فَلَمَّا اجْتَرَّهُ رَفَعَ رَأْسَهُ إِلَى السَّمَاءِ حَتَّى مَا يَرَاهَا، فَلَمَّا أَصْبَحَ حَدَّثَ النَّبِيَّ ﷺ، فَقَالَ : «اقْرَأْ يَا ابْنَ حُضَيْرٍ، اقْرَأْ يَا ابْنَ حُضَيْرٍ». قَالَ : فَأَشْفَقْتُ يَا رَسُولَ اللَّهِ أَنْ تَطَأَ يَحْيَى وَكَانَ مِنْهَا قَرِيبًا، فَرَفَعْتُ رَأْسِي، فَانْصَرَفْتُ إِلَيْهِ، فَرَفَعْتُ رَأْسِي إِلَى السَّمَاءِ فَإِذَا مِثْلُ الظُّلَّةِ فِيهَا أَمْثَالُ الْمَصَابِيحِ، فَخَرَجَتْ حَتَّى لَا أَرَاهَا. قَالَ : «وَتَدْرِي مَا ذَاكَ ؟». قَالَ : لَا. قَالَ : «تِلْكَ الْمَلَائِكَةُ دَنَتْ لِصَوْتِكَ، وَلَوْ قَرَأْتَ لَأَصْبَحَتْ يَنْظُرُ النَّاسُ إِلَيْهَا لَا تَتَوَارَى مِنْهُمْ».", "الأغر المزني|فضل الاستغفار": "يَا أَيُّهَا النَّاسُ، تُوبُوا إِلَى اللَّهِ، فَإِنِّي أَتُوبُ فِي الْيَوْمِ إِلَيْهِ مِائَةَ مَرَّةٍ.", "أهبان بن أوس|وضع الوسادة تحت ركبته في الصلاة لحاجة": "اشْتَكَى رُكْبَتَهُ، وَكَانَ إِذَا سَجَدَ جَعَلَ تَحْتَ رُكْبَتِهِ وِسَادَةً.", "إياس بن ثعلبة|الوعيد الشديد لمن اقتطع حق مسلم بيمين": "مَنِ اقْتَطَعَ حَقَّ امْرِئٍ مُسْلِمٍ بِيَمِينِهِ فَقَدْ أَوْجَبَ اللَّهُ لَهُ النَّارَ، وَحَرَّمَ عَلَيْهِ الْجَنَّةَ. فَقَالَ لَهُ رَجُلٌ : وَإِنْ كَانَ شَيْئًا يَسِيرًا يَا رَسُولَ اللَّهِ، قَالَ : «وَإِنْ قَضِيبًا مِنْ أَرَاكٍ».", "البراء بن عازب|كم اعتمر النبي ﷺ": "فِي ذِي الْقَعْدَةِ قَبْلَ أَنْ يَحُجَّ مَرَّتَيْنِ.", "البراء بن عازب|فضل الصحبة وعدم الاغترار بالعمل": "طُوبَى لَكَ؛ صَحِبْتَ النَّبِيَّ ﷺ، وَبَايَعْتَهُ تَحْتَ الشَّجَرَةِ. فَقَالَ : يَا ابْنَ أَخِي، إِنَّكَ لَا تَدْرِي مَا أَحْدَثْنَا بَعْدَهُ.", "أبي بن كعب|اللقطة": "أَخَذْتُ صُرَّةً مِائَةَ دِينَارٍ فَأَتَيْتُ النَّبِيَّ ﷺ، فَقَالَ : «عَرِّفْهَا حَوْلًا». فَعَرَّفْتُهَا حَوْلًا، فَلَمْ أَجِدْ مَنْ يَعْرِفُهَا، ثُمَّ أَتَيْتُهُ فَقَالَ: «عَرِّفْهَا حَوْلًا». فَعَرَّفْتُهَا فَلَمْ أَجِدْ، ثُمَّ أَتَيْتُهُ ثَلَاثًا، فَقَالَ : «احْفَظْ وِعَاءَهَا، وَعَدَدَهَا، وَوِكَاءَهَا، فَإِنْ جَاءَ صَاحِبُهَا، وَإِلَّا فَاسْتَمْتِعْ بِهَا». فَاسْتَمْتَعْتُ، فَلَقِيتُهُ بَعْدُ بِمَكَّةَ، فَقَالَ : لَا أَدْرِي ثَلَاثَةَ أَحْوَالٍ أَوْ حَوْلًا وَاحِدًا.", "أبي بن كعب|ما جاء فيمن جامع ولم ينزل": "أُبَيُّ بْنُ كَعْبٍ أَنَّهُ قَالَ : يَا رَسُولَ اللَّهِ، إِذَا جَامَعَ الرَّجُلُ الْمَرْأَةَ فَلَمْ يُنْزِلْ ؟ قَالَ : «يَغْسِلُ مَا مَسَّ الْمَرْأَةَ مِنْهُ، ثُمَّ يَتَوَضَّأُ وَيُصَلِّي». قَالَ أَبُو عَبْدِ اللَّهِ : الْغَسْلُ أَحْوَطُ، وَذَاكَ الْآخِرُ، وَإِنَّمَا بَيَّنَّا لِاخْتِلَافِهِمْ.", "أبي بن كعب|ثبوت المعوذتين": "سَأَلْتُ أُبَيَّ بْنَ كَعْبٍ قُلْتُ : يَا أَبَا الْمُنْذِرِ، إِنَّ أَخَاكَ ابْنَ مَسْعُودٍ يَقُولُ كَذَا وَكَذَا. فَقَالَ أُبَيٌّ : سَأَلْتُ رَسُولَ اللَّهِ ﷺ، فَقَالَ لِي : «قِيلَ لِي، فَقُلْتُ». قَالَ : فَنَحْنُ نَقُولُ كَمَا قَالَ رَسُولُ اللَّهِ ﷺ.", "أبي بن كعب|فضل آية الكرسي": "يَا أَبَا الْمُنْذِرِ، أَتَدْرِي أَيُّ آيَةٍ مِنْ كِتَابِ اللَّهِ مَعَكَ أَعْظَمُ ؟. قَالَ : قُلْتُ : اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ : «يَا أَبَا الْمُنْذِرِ، أَتَدْرِي أَيُّ آيَةٍ مِنْ كِتَابِ اللَّهِ مَعَكَ أَعْظَمُ ؟». قَالَ : قُلْتُ : ﴿اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾. قَالَ : فَضَرَبَ فِي صَدْرِي وَقَالَ : «وَاللَّهِ، لِيَهْنِكَ الْعِلْمُ أَبَا الْمُنْذِرِ».", "أبي بن كعب|ليلة القدر": "ابْنَ مَسْعُودٍ يَقُولُ : مَنْ يَقُمِ الْحَوْلَ يُصِبْ لَيْلَةَ الْقَدْرِ، فَقَالَ : رَحِمَهُ اللَّهُ، أَرَادَ أَنْ لَا يَتَّكِلَ النَّاسُ، أَمَا إِنَّهُ قَدْ عَلِمَ أَنَّهَا فِي رَمَضَانَ، وَأَنَّهَا فِي الْعَشْرِ الْأَوَاخِرِ، وَأَنَّهَا لَيْلَةُ سَبْعٍ وَعِشْرِينَ، ثُمَّ حَلَفَ لَا يَسْتَثْنِي، أَنَّهَا لَيْلَةُ سَبْعٍ وَعِشْرِينَ، فَقُلْتُ : بِأَيِّ شَيْءٍ تَقُولُ ذَلِكَ يَا أَبَا الْمُنْذِرِ ؟ قَالَ : بِالْعَلَامَةِ، أَوْ بِالْآيَةِ الَّتِي أَخْبَرَنَا رَسُولُ اللَّهِ ﷺ، أَنَّهَا تَطْلُعُ يَوْمَئِذٍ لَا شُعَاعَ لَهَا.", "أبي بن كعب|فضل أبي بن كعب": "قَالَ عُمَرُ رَضِيَ اللَّهُ عَنْهُ : أَقْرَؤُنَا أُبَيٌّ، وَأَقْضَانَا عَلِيٌّ، وَإِنَّا لَنَدَعُ مِنْ قَوْلِ أُبَيٍّ؛ وَذَاكَ أَنَّ أُبَيًّا يَقُولُ : لَا أَدَعُ شَيْئًا سَمِعْتُهُ مِنْ رَسُولِ اللَّهِ ﷺ، وَقَدْ قَالَ اللَّهُ تَعَالَى : مَا نَنْسَخْ مِنْ آيَةٍ أَوْ نَنْسَأْهَا.", "أسامة بن زيد|ما جاء في الطاعون": "رِجْزٌ - أَوْ عَذَابٌ - عُذِّبَ بِهِ بَعْضُ الْأُمَمِ، ثُمَّ بَقِيَ مِنْهُ بَقِيَّةٌ، فَيَذْهَبُ الْمَرَّةَ، وَيَأْتِي الْأُخْرَى، فَمَنْ سَمِعَ بِهِ بِأَرْضٍ، فَلَا يُقْدِمَنَّ عَلَيْهِ، وَمَنْ كَانَ بِأَرْضٍ وَقَعَ بِهَا، فَلَا يَخْرُجْ فِرَارًا مِنْهُ.", "أسامة بن زيد|النهي عن قتل من قال لا إله إلا الله": "بَعَثَنَا رَسُولُ اللَّهِ ﷺ إِلَى الْحُرَقَةِ مِنْ جُهَيْنَةَ، قَالَ : فَصَبَّحْنَا الْقَوْمَ فَهَزَمْنَاهُمْ، قَالَ : وَلَحِقْتُ أَنَا وَرَجُلٌ مِنَ الْأَنْصَارِ رَجُلًا مِنْهُمْ، قَالَ : فَلَمَّا غَشِينَاهُ قَالَ : لَا إِلَهَ إِلَّا اللَّهُ. قَالَ : فَكَفَّ عَنْهُ الْأَنْصَارِيُّ، فَطَعَنْتُهُ بِرُمْحِي حَتَّى قَتَلْتُهُ، قَالَ : فَلَمَّا قَدِمْنَا بَلَغَ ذَلِكَ النَّبِيَّ ﷺ، قَالَ : فَقَالَ لِي : «يَا أُسَامَةُ، أَقَتَلْتَهُ بَعْدَمَا قَالَ : لَا إِلَهَ إِلَّا اللَّهُ ؟». قَالَ : قُلْتُ : يَا رَسُولَ اللَّهِ، إِنَّمَا كَانَ مُتَعَوِّذًا. قَالَ : «أَقَتَلْتَهُ بَعْدَ أَنْ قَالَ : لَا إِلَهَ إِلَّا اللَّهُ ؟». قَالَ : فَمَا زَالَ يُكَرِّرُهَا عَلَيَّ حَتَّى تَمَنَّيْتُ أَنِّي لَمْ أَكُنْ أَسْلَمْتُ قَبْلَ ذَلِكَ الْيَوْمِ.", "أسامة بن زيد|التعزية عند موت الولد": "أَرْسَلَتِ ابْنَةُ النَّبِيِّ ﷺ إِلَيْهِ : إِنَّ ابْنًا لِي قُبِضَ، فَأْتِنَا. فَأَرْسَلَ يُقْرِئُ السَّلَامَ، وَيَقُولُ : «إِنَّ لِلَّهِ مَا أَخَذَ، وَلَهُ مَا أَعْطَى، وَكُلٌّ عِنْدَهُ بِأَجَلٍ مُسَمًّى، فَلْتَصْبِرْ وَلْتَحْتَسِبْ». فَأَرْسَلَتْ إِلَيْهِ تُقْسِمُ عَلَيْهِ لَيَأْتِيَنَّهَا، فَقَامَ وَمَعَهُ سَعْدُ بْنُ عُبَادَةَ، وَمُعَاذُ بْنُ جَبَلٍ، وَأُبَيُّ بْنُ كَعْبٍ، وَزَيْدُ بْنُ ثَابِتٍ، وَرِجَالٌ، فَرُفِعَ إِلَى رَسُولِ اللَّهِ ﷺ الصَّبِيُّ وَنَفْسُهُ تَتَقَعْقَعُ، قَالَ : حَسِبْتُهُ أَنَّهُ قَالَ : كَأَنَّهَا شَنٌّ، فَفَاضَتْ عَيْنَاهُ، فَقَالَ سَعْدٌ : يَا رَسُولَ اللَّهِ، مَا هَذَا ؟ فَقَالَ : «هَذِهِ رَحْمَةٌ جَعَلَهَا اللَّهُ فِي قُلُوبِ عِبَادِهِ، وَإِنَّمَا يَرْحَمُ اللَّهُ مِنْ عِبَادِهِ الرُّحَمَاءَ».", "أسامة بن زيد|فتنة النساء": "مَا تَرَكْتُ بَعْدِي فِتْنَةً أَضَرَّ عَلَى الرِّجَالِ مِنَ النِّسَاءِ.", "أسامة بن زيد|أكثر أهل الجنة وأكثر أهل النار": "قُمْتُ عَلَى بَابِ الْجَنَّةِ، فَكَانَ عَامَّةَ مَنْ دَخَلَهَا الْمَسَاكِينُ، وَأَصْحَابُ الْجَدِّ مَحْبُوسُونَ، غَيْرَ أَنَّ أَصْحَابَ النَّارِ قَدْ أُمِرَ بِهِمْ إِلَى النَّارِ، وَقُمْتُ عَلَى بَابِ النَّارِ فَإِذَا عَامَّةُ مَنْ دَخَلَهَا النِّسَاءُ.", "أسامة بن زيد|صفة دفع الحاج من عرفة": "سُئِلَ أُسَامَةُ وَأَنَا جَالِسٌ : كَيْفَ كَانَ رَسُولُ اللَّهِ ﷺ يَسِيرُ فِي حَجَّةِ الْوَدَاعِ حِينَ دَفَعَ ؟ قَالَ : كَانَ يَسِيرُ الْعَنَقَ، فَإِذَا وَجَدَ فَجْوَةً نَصَّ. قَالَ هِشَامٌ : وَالنَّصُّ فَوْقَ الْعَنَقِ.", "أسامة بن زيد|كثرة الفتن وتتابعها": "أَشْرَفَ النَّبِيُّ ﷺ عَلَى أُطُمٍ مِنْ آطَامِ الْمَدِينَةِ فَقَالَ : «هَلْ تَرَوْنَ مَا أَرَى ؟ إِنِّي لَأَرَى مَوَاقِعَ الْفِتَنِ خِلَالَ بُيُوتِكُمْ كَمَوَاقِعِ الْقَطْرِ».", "أسامة بن زيد|ربا النسيئة": "لَا رِبًا إِلَّا فِي النَّسِيئَةِ.", "أسامة بن زيد|مناقب الحسن بن علي وأسامة بن زيد": "حَدَّثَ عَنِ النَّبِيِّ ﷺ؛ أَنَّهُ كَانَ يَأْخُذُهُ وَالْحَسَنَ فَيَقُولُ : «اللَّهُمَّ أَحِبَّهُمَا؛ فَإِنِّي أُحِبُّهُمَا».", "أسامة بن زيد|صلاة العشاءين بعد الإفاضة": "دَفَعَ رَسُولُ اللَّهِ ﷺ مِنْ عَرَفَةَ حَتَّى إِذَا كَانَ بِالشِّعْبِ نَزَلَ فَبَالَ ثُمَّ تَوَضَّأَ وَلَمْ يُسْبِغِ الْوُضُوءَ، فَقُلْتُ : الصَّلَاةَ يَا رَسُولَ اللَّهِ. فَقَالَ : «الصَّلَاةُ أَمَامَكَ». فَرَكِبَ، فَلَمَّا جَاءَ الْمُزْدَلِفَةَ نَزَلَ فَتَوَضَّأَ فَأَسْبَغَ الْوُضُوءَ، ثُمَّ أُقِيمَتِ الصَّلَاةُ فَصَلَّى الْمَغْرِبَ، ثُمَّ أَنَاخَ كُلُّ إِنْسَانٍ بَعِيرَهُ فِي مَنْزِلِهِ، ثُمَّ أُقِيمَتِ الْعِشَاءُ فَصَلَّى، وَلَمْ يُصَلِّ بَيْنَهُمَا.", "أسامة بن زيد|خطر من يخالف قوله فعله": "يُجَاءُ بِالرَّجُلِ يَوْمَ الْقِيَامَةِ، فَيُلْقَى فِي النَّارِ، فَتَنْدَلِقُ أَقْتَابُهُ فِي النَّارِ، فَيَدُورُ كَمَا يَدُورُ الْحِمَارُ بِرَحَاهُ، فَيَجْتَمِعُ أَهْلُ النَّارِ عَلَيْهِ، فَيَقُولُونَ : أَيْ فُلَانُ، مَا شَأْنُكَ ؟ أَلَيْسَ كُنْتَ تَأْمُرُنَا بِالْمَعْرُوفِ، وَتَنْهَى عَنِ الْمُنْكَرِ ؟ قَالَ : كُنْتُ آمُرُكُمْ بِالْمَعْرُوفِ وَلَا آتِيهِ، وَأَنْهَاكُمْ عَنِ الْمُنْكَرِ وَآتِيهِ.", "أسامة بن زيد|كراهة العزل": "فَقَالَ : إِنِّي أَعْزِلُ عَنِ امْرَأَتِي، فَقَالَ لَهُ رَسُولُ اللَّهِ ﷺ : «لِمَ تَفْعَلُ ذَلِكَ ؟». فَقَالَ الرَّجُلُ : أُشْفِقُ عَلَى وَلَدِهَا، أَوْ عَلَى أَوْلَادِهَا، فَقَالَ رَسُولُ اللَّهِ ﷺ : «لَوْ كَانَ ذَلِكَ ضَارًّا ضَرَّ فَارِسَ، وَالرُّومَ». وَقَالَ زُهَيْرٌ فِي رِوَايَتِهِ : «إِنْ كَانَ لِذَلِكَ، فَلَا مَا ضَارَ ذَلِكَ فَارِسَ، وَلَا الرُّومَ».", "أسامة بن زيد|دخول الكعبة والصلاة فيها": "لَمَّا دَخَلَ الْبَيْتَ؛ دَعَا فِي نَوَاحِيهِ كُلِّهَا، وَلَمْ يُصَلِّ فِيهِ، حَتَّى خَرَجَ، فَلَمَّا خَرَجَ؛ رَكَعَ فِي قُبُلِ الْبَيْتِ رَكْعَتَيْنِ، وَقَالَ : «هَذِهِ الْقِبْلَةُ». قُلْتُ لَهُ : مَا نَوَاحِيهَا، أَفِي زَوَايَاهَا ؟ قَالَ : بَلْ فِي كُلِّ قِبْلَةٍ مِنَ الْبَيْتِ.", "أسيد بن حضير|الصبر عند الأثرة": "سَتَلْقَوْنَ بَعْدِي أُثْرَةً، فَاصْبِرُوا حَتَّى تَلْقَوْنِي عَلَى الْحَوْضِ.", "البراء بن عازب|ربا النسيئة": "قَدِمَ النَّبِيُّ ﷺ وَنَحْنُ نَتَبَايَعُ هَذَا الْبَيْعَ، فَقَالَ : «مَا كَانَ يَدًا بِيَدٍ فَلَيْسَ بِهِ بَأْسٌ، وَمَا كَانَ نَسِيئَةً فَلَا يَصْلُحُ». وَالْقَ زَيْدَ بْنَ أَرْقَمَ فَاسْأَلْهُ؛ فَإِنَّهُ كَانَ أَعْظَمَنَا تِجَارَةً، فَسَأَلْتُ زَيْدَ بْنَ أَرْقَمَ فَقَالَ مِثْلَهُ، وَقَالَ سُفْيَانُ مَرَّةً : فَقَالَ : قَدِمَ عَلَيْنَا النَّبِيُّ ﷺ الْمَدِينَةَ وَنَحْنُ نَتَبَايَعُ، وَقَالَ : «نَسِيئَةً إِلَى الْمَوْسِمِ أَوِ الْحَجِّ».", "البراء بن عازب|رفع المرفقين عن الأرض في السجود": "إِذَا سَجَدْتَ فَضَعْ كَفَّيْكَ وَارْفَعْ مِرْفَقَيْكَ.", "البراء بن عازب|حسن النبي ﷺ": "سُئِلَ الْبَرَاءُ : أَكَانَ وَجْهُ النَّبِيِّ ﷺ مِثْلَ السَّيْفِ ؟ قَالَ : لَا، بَلْ مِثْلَ الْقَمَرِ.", "البراء بن عازب|عدد غزوات النبي ﷺ": "غَزَوْتُ مَعَ النَّبِيِّ ﷺ خَمْسَ عَشْرَةَ.", "البراء بن عازب|الأجر الكثير في العمل اليسير": "أَتَى النَّبِيَّ ﷺ رَجُلٌ مُقَنَّعٌ بِالْحَدِيدِ، فَقَالَ : يَا رَسُولَ اللَّهِ، أُقَاتِلُ وَأُسْلِمُ ؟ قَالَ : «أَسْلِمْ ثُمَّ قَاتِلْ». فَأَسْلَمَ ثُمَّ قَاتَلَ، فَقُتِلَ، فَقَالَ رَسُولُ اللَّهِ ﷺ : «عَمِلَ قَلِيلًا وَأُجِرَ كَثِيرًا».", "البراء بن عازب|فضل الجنة ونعيمها": "أُهْدِيَتْ لِلنَّبِيِّ ﷺ حُلَّةُ حَرِيرٍ فَجَعَلَ أَصْحَابُهُ يَمَسُّونَهَا، وَيَعْجَبُونَ مِنْ لِينِهَا، فَقَالَ : «أَتَعْجَبُونَ مِنْ لِينِ هَذِهِ ؟ لَمَنَادِيلُ سَعْدِ بْنِ مُعَاذٍ خَيْرٌ مِنْهَا» أَوْ : «أَلْيَنُ».", "البراء بن عازب|آخر ما نزل من القرآن": "آخِرُ سُورَةٍ نَزَلَتْ بَرَاءَةٌ، وَآخِرُ آيَةٍ نَزَلَتْ : ﴿يَسْتَفْتُونَكَ﴾.", "البراء بن عازب|بعض صفاته ﷺ": "كَانَ رَسُولُ اللَّهِ ﷺ رَجُلًا مَرْبُوعًا، بَعِيدَ مَا بَيْنَ الْمَنْكِبَيْنِ، عَظِيمَ الْجُمَّةِ إِلَى شَحْمَةِ أُذُنَيْهِ، عَلَيْهِ حُلَّةٌ حَمْرَاءُ، مَا رَأَيْتُ شَيْئًا قَطُّ أَحْسَنَ مِنْهُ ﷺ.", "البراء بن عازب|فضل سورة الكهف": "كَانَ رَجُلٌ يَقْرَأُ سُورَةَ الْكَهْفِ وَإِلَى جَانِبِهِ حِصَانٌ مَرْبُوطٌ بِشَطَنَيْنِ، فَتَغَشَّتْهُ سَحَابَةٌ، فَجَعَلَتْ تَدْنُو، وَتَدْنُو، وَجَعَلَ فَرَسُهُ يَنْفِرُ، فَلَمَّا أَصْبَحَ أَتَى النَّبِيَّ ﷺ، فَذَكَرَ ذَلِكَ لَهُ، فَقَالَ : «تِلْكَ السَّكِينَةُ تَنَزَّلَتْ بِالْقُرْآنِ».", "البراء بن عازب|فضل الشعر في نصرة الدين": "قَالَ النَّبِيُّ ﷺ لِحَسَّانَ : «اهْجُهُمْ - أَوْ هَاجِهِمْ - وَجِبْرِيلُ مَعَكَ».", "البراء بن عازب|حب الأنصار من الإيمان": "الْأَنْصَارُ لَا يُحِبُّهُمْ إِلَّا مُؤْمِنٌ، وَلَا يُبْغِضُهُمْ إِلَّا مُنَافِقٌ، فَمَنْ أَحَبَّهُمْ أَحَبَّهُ اللَّهُ، وَمَنْ أَبْغَضَهُمْ أَبْغَضَهُ اللَّهُ.", "البراء بن عازب|القراءة في العشاء": "سَمِعْتُ النَّبِيَّ ﷺ يَقْرَأُ فِي الْعِشَاءِ : «﴿وَالتِّينِ وَالزَّيْتُونِ﴾». فَمَا سَمِعْتُ أَحَدًا أَحْسَنَ صَوْتًا أَوْ قِرَاءَةً مِنْهُ.", "البراء بن عازب|تحريم الحمر الأهلية": "أَمَرَنَا النَّبِيُّ ﷺ فِي غَزْوَةِ خَيْبَرَ أَنْ نُلْقِيَ الْحُمُرَ الْأَهْلِيَّةَ نِيئَةً وَنَضِيجَةً، ثُمَّ لَمْ يَأْمُرْنَا بِأَكْلِهِ بَعْدُ.", "البراء بن عازب|الدعاء عند النوم": "إِذَا أَتَيْتَ مَضْجَعَكَ فَتَوَضَّأْ وُضُوءَكَ لِلصَّلَاةِ، ثُمَّ اضْطَجِعْ عَلَى شِقِّكَ الْأَيْمَنِ، ثُمَّ قُلْ : اللَّهُمَّ أَسْلَمْتُ وَجْهِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ، اللَّهُمَّ آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ. فَإِنْ مُتَّ مِنْ لَيْلَتِكَ فَأَنْتَ عَلَى الْفِطْرَةِ، وَاجْعَلْهُنَّ آخِرَ مَا تَتَكَلَّمُ بِهِ. قَالَ : فَرَدَّدْتُهَا عَلَى النَّبِيِّ ﷺ، فَلَمَّا بَلَغْتُ : اللَّهُمَّ آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، قُلْتُ : وَرَسُولِكَ، قَالَ : «لَا، وَنَبِيِّكَ الَّذِي أَرْسَلْتَ».", "البراء بن عازب|أولاد المسلمين في الآخرة": "لَمَّا تُوُفِّيَ إِبْرَاهِيمُ عَلَيْهِ السَّلَامُ قَالَ رَسُولُ اللَّهِ ﷺ : «إِنَّ لَهُ مُرْضِعًا فِي الْجَنَّةِ».", "البراء بن عازب|أمرنا بسبع ونهانا عن سبع": "أَمَرَنَا رَسُولُ اللَّهِ ﷺ بِسَبْعٍ، وَنَهَانَا عَنْ سَبْعٍ : أَمَرَنَا بِعِيَادَةِ الْمَرِيضِ، وَاتِّبَاعِ الْجِنَازَةِ، وَتَشْمِيتِ الْعَاطِسِ، وَإِجَابَةِ الدَّاعِي، وَإِفْشَاءِ السَّلَامِ، وَنَصْرِ الْمَظْلُومِ، وَإِبْرَارِ الْمُقْسِمِ، وَنَهَانَا عَنْ خَوَاتِيمِ الذَّهَبِ، وَعَنِ الشُّرْبِ فِي الْفِضَّةِ - أَوْ قَالَ : آنِيَةِ الْفِضَّةِ - وَعَنِ الْمَيَاثِرِ وَالْقَسِّيِّ، وَعَنْ لُبْسِ الْحَرِيرِ وَالدِّيبَاجِ وَالْإِسْتَبْرَقِ.", "البراء بن عازب|عدة أصحاب بدر": "حَدَّثَنِي أَصْحَابُ مُحَمَّدٍ ﷺ مِمَّنْ شَهِدَ بَدْرًا أَنَّهُمْ كَانُوا عِدَّةَ أَصْحَابِ طَالُوتَ الَّذِينَ جَازُوا مَعَهُ النَّهَرَ بِضْعَةَ عَشَرَ وَثَلَاثَمِائَةٍ. قَالَ الْبَرَاءُ : لَا وَاللَّهِ مَا جَاوَزَ مَعَهُ النَّهَرَ إِلَّا مُؤْمِنٌ.", "البراء بن عازب|الذكر عند النوم": "الْبَرَاءِ أَنَّ النَّبِيَّ ﷺ كَانَ إِذَا أَخَذَ مَضْجَعَهُ قَالَ : «اللَّهُمَّ بِاسْمِكَ أَحْيَا، وَبِاسْمِكَ أَمُوتُ». وَإِذَا اسْتَيْقَظَ قَالَ : «الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَمَا أَمَاتَنَا، وَإِلَيْهِ النُّشُورُ». الجمع المسند بين الصحيحين بالأسانيد", "البراء بن عازب|مناقب الحسن بن علي": "رَأَيْتُ النَّبِيَّ ﷺ وَالْحَسَنُ عَلَى عَاتِقِهِ يَقُولُ : «اللَّهُمَّ إِنِّي أُحِبُّهُ فَأَحِبَّهُ».", "البراء بن عازب|متابعة الإمام وعدم سبقه": "كَانَ رَسُولُ اللَّهِ ﷺ إِذَا قَالَ : «سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ» لَمْ يَحْنِ أَحَدٌ مِنَّا ظَهْرَهُ، حَتَّى يَقَعَ النَّبِيُّ ﷺ سَاجِدًا، ثُمَّ نَقَعُ سُجُودًا بَعْدَهُ.", "البراء بن عازب|قنوت النوازل": "قَنَتَ رَسُولُ اللَّهِ ﷺ فِي الْفَجْرِ وَالْمَغْرِبِ.", "البراء بن عازب|عذاب القبر": "إِذَا أُقْعِدَ الْمُؤْمِنُ فِي قَبْرِهِ أُتِيَ ثُمَّ شَهِدَ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، فَذَلِكَ قَوْلُهُ : ﴿يُثَبِّتُ اللَّهُ الَّذِينَ آمَنُوا بِالْقَوْلِ الثَّابِتِ﴾ قَالَ : نَزَلَتْ فِي عَذَابِ الْقَبْرِ."};
const MT={"عذاب القبر": "إذا أُقعد المؤمن في قبره أُتي، ثم شهد أن لا إله إلا الله وأن محمدًا رسول الله، فذلك قوله: ﴿يثبت الله الذين آمنوا بالقول الثابت﴾. قال: نزلت في عذاب القبر.", "الدعاء عند النوم": "إذا أتيتَ مضجعك فتوضأ وضوءك للصلاة، ثم اضطجع على شقك الأيمن، ثم قل: اللهم أسلمتُ وجهي إليك، وفوّضتُ أمري إليك، وألجأتُ ظهري إليك، رغبةً ورهبةً إليك، لا ملجأ ولا منجى منك إلا إليك، اللهم آمنتُ بكتابك الذي أنزلتَ، وبنبيك الذي أرسلتَ. فإن مِتّ من ليلتك فأنت على الفطرة، واجعلهن آخر ما تتكلم به. قال: فرددتها على النبي ﷺ، فلما بلغتُ: اللهم آمنتُ بكتابك الذي أنزلتَ، قلت: ورسولك. قال: لا، ونبيّك الذي أرسلتَ.", "تحريم الحمر الأهلية": "أمرنا النبي ﷺ في غزوة خيبر أن نُلقي الحمر الأهلية نيئةً ونضيجةً، ثم لم يأمرنا بأكله بعد.", "متابعة الإمام وعدم سبقه": "كان رسول الله ﷺ إذا قال: سمع الله لمن حمده، لم يَحنِ أحدٌ منا ظهره حتى يقع النبي ﷺ ساجدًا، ثم نقع سجودًا بعده.", "حب الأنصار من الإيمان": "الأنصار لا يحبهم إلا مؤمن، ولا يبغضهم إلا منافق، فمن أحبهم أحبه الله، ومن أبغضهم أبغضه الله.", "مناقب الحسن بن علي": "رأيتُ النبي ﷺ والحسن بن علي على عاتقه يقول: اللهم إني أحبه فأحبه.", "فضل الشعر في نصرة الدين": "قال النبي ﷺ لحسان: اهجُهم — أو هاجِهم — وجبريل معك.", "القراءة في العشاء": "سمعتُ النبي ﷺ يقرأ في العشاء: ﴿والتين والزيتون﴾، فما سمعتُ أحدًا أحسن صوتًا أو قراءةً منه.", "فضل سورة الكهف": "كان رجلٌ يقرأ سورة الكهف وإلى جانبه حصانٌ مربوطٌ بشطنين، فتغشّته سحابة، فجعلت تدنو وتدنو، وجعل فرسه ينفر منها. فلما أصبح أتى النبي ﷺ فذكر ذلك له، فقال: تلك السكينة تنزلت للقرآن.", "بعض صفاته ﷺ": "كان رسول الله ﷺ رجلًا مربوعًا، بعيد ما بين المنكبين، عظيم الجمّة إلى شحمة أذنيه، عليه حلّة حمراء، ما رأيتُ شيئًا قطّ أحسن منه ﷺ.", "رفع المرفقين عن الأرض في السجود": "إذا سجدتَ فضع كفيك وارفع مرفقيك.", "حسن النبي ﷺ": "سُئل البراء: أكان وجه النبي ﷺ مثل السيف؟ قال: لا، مثل القمر.", "عدد غزوات النبي ﷺ": "غزوتُ مع النبي ﷺ خمس عشرة.", "عدة أصحاب بدر": "حدّثني أصحاب محمد ﷺ ممن شهد بدرًا أنهم كانوا عدّة أصحاب طالوت الذين جازوا معه النهر، بضعةَ عشر وثلاثمائة. قال البراء: لا والله ما جاوز معه النهر إلا مؤمن.", "أمرنا بسبع ونهانا عن سبع": "أمرنا رسول الله ﷺ بسبع ونهانا عن سبع: أمرنا بعيادة المريض، واتباع الجنازة، وتشميت العاطس، وإبرار المقسم، ونصر المظلوم، وإجابة الداعي، وإفشاء السلام. ونهانا عن خواتيم — أو عن تختّم — الذهب، وعن الشرب في الفضة، وعن المياثر، وعن القسّي، وعن لبس الحرير والإستبرق والديباج.", "آخر ما نزل من القرآن": "آخر آية نزلت: ﴿يستفتونك قل الله يفتيكم في الكلالة﴾، وآخر سورة نزلت: براءة.", "قنوت النوازل": "قنت رسول الله ﷺ في الفجر والمغرب.", "الذكر عند النوم": "كان النبي ﷺ إذا أخذ مضجعه قال: باسمك اللهم أحيا وأموت، وإذا استيقظ قال: الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور.", "أولاد المسلمين في الآخرة": "لما توفي إبراهيم قال رسول الله ﷺ: إن له مرضعًا في الجنة.", "الأجر الكثير في العمل اليسير": "أتى النبيَّ ﷺ رجلٌ مقنَّعٌ بالحديد فقال: يا رسول الله، أقاتل وأُسلم؟ قال: أسلِمْ ثم قاتل. فأسلم ثم قاتل فقُتل. فقال رسول الله ﷺ: عمل قليلًا وأُجر كثيرًا.", "فضل الجنة ونعيمها": "أُهديت لرسول الله ﷺ حلّة حرير، فجعل أصحابه يمسّونها ويعجبون من لينها، فقال: أتعجبون من لين هذه؟ لمناديل سعد بن معاذ في الجنة خيرٌ منها وألين."};
