<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الجمع المسند بين الصحيحين</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f3d2e">
<link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f3ea;--card:#fff;--tx:#1d2a24;--g:#0f3d2e;--gold:#b8892b;--mu:#6b756f}
@media(prefers-color-scheme:dark){:root{--bg:#10150f;--card:#1a221c;--tx:#e8ece6;--g:#2f7a5c;--gold:#d8b15a;--mu:#98a39b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--g);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 14px 12px;position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0 0 8px}input,select{width:100%;padding:10px;border-radius:10px;border:0;font-size:15px;margin-top:6px;background:#fff;color:#111}
.row{display:flex;gap:6px}.row>*{flex:1}
.bar{padding:10px 14px;margin:10px;border-radius:12px;background:var(--card);border-right:4px solid var(--gold);display:none}
.bar button{margin-top:6px;background:var(--g);color:#fff;border:0;padding:8px 14px;border-radius:8px;font-size:14px}
.bar button.x{background:transparent;color:var(--mu)}
.item{background:var(--card);margin:8px 10px;padding:12px;border-radius:12px;display:flex;gap:10px;align-items:flex-start}
.num{background:var(--g);color:#fff;min-width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.ti{font-size:16px;line-height:1.6}.me{font-size:12px;color:var(--mu);margin-top:3px}
.tag{display:inline-block;padding:1px 8px;border-radius:8px;font-size:11px;color:#fff;margin-inline-start:6px}
.a{background:var(--gold)}.b{background:#2b6cb0}.m{background:#7b3f9e}
#cnt{padding:4px 14px;color:var(--mu);font-size:13px}
</style></head><body>
<header><h1>الجمع المسند بين الصحيحين</h1>
<input id="q" type="search" placeholder="ابحث في العناوين أو الصحابة…">
<div class="row"><select id="c"><option value="">كل الصحابة</option></select>
<select id="t"><option value="">كل الأنواع</option><option value="a">متفق عليه</option><option value="b">أفراد البخاري</option><option value="m">أفراد مسلم</option></select></div></header>
<div class="bar" id="ann"><b id="at"></b><div id="ax"></div><button class="x" id="ad">إغلاق</button></div>
<div class="bar" id="upd">يتوفر تحديث جديد للتطبيق.<br><button id="ub">تحديث الآن</button></div>
<div class="bar" id="ins">ثبّت التطبيق للوصول السريع من الشاشة الرئيسية.<br><button id="ib">تثبيت</button> <button class="x" id="ix">لاحقاً</button></div>
<div class="bar" id="ios">لتثبيت التطبيق على آيفون: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».<br><button class="x" id="iox">إغلاق</button></div>
<div id="cnt"></div><main id="l"></main>
<script src="data.js"></script>
<script>
const $=i=>document.getElementById(i),T={a:"متفق عليه",b:"البخاري",m:"مسلم"};
COMPANIONS.forEach((x,i)=>$("c").add(new Option(`${x.n} (${x.t})`,i)));
function norm(s){return s.replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")}
function draw(){const q=norm($("q").value.trim()),c=$("c").value,t=$("t").value;
const r=H.filter(h=>(c===""||h[1]==c)&&(!t||h[2]==t)&&(!q||norm(h[3]+" "+COMPANIONS[h[1]].n).includes(q)));
$("cnt").textContent=r.length+" حديث";
$("l").innerHTML=r.map(h=>`<div class="item"><div class="num">${h[0]}</div><div><div class="ti">${h[3]}</div><div class="me">${COMPANIONS[h[1]].n}<span class="tag ${h[2]}">${T[h[2]]}</span></div></div></div>`).join("")}
["q","c","t"].forEach(i=>$(i).addEventListener("input",draw));draw();
// إعلانات داخلية
fetch("announcements.json",{cache:"no-store"}).then(r=>r.json()).then(a=>{
 if(a.show&&localStorage.getItem("ann")!==a.id){$("at").textContent=a.title;$("ax").textContent=a.text;$("ann").style.display="block";
 $("ad").onclick=()=>{try{localStorage.setItem("ann",a.id)}catch(e){}$("ann").style.display="none"}}}).catch(()=>{});
// تحديث التطبيق
if("serviceWorker"in navigator){navigator.serviceWorker.register("sw.js").then(reg=>{
 const show=w=>{$("upd").style.display="block";$("ub").onclick=()=>w.postMessage("skip")};
 if(reg.waiting&&navigator.serviceWorker.controller)show(reg.waiting);
 reg.addEventListener("updatefound",()=>{const w=reg.installing;w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)show(w)})});
 setInterval(()=>reg.update(),3600000)});
 let r=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!r){r=true;location.reload()}})}
// اختصار التثبيت
let dp;const sa=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;if(!sa&&!localStorage.getItem("insx"))$("ins").style.display="block"});
$("ib").onclick=async()=>{dp.prompt();await dp.userChoice;$("ins").style.display="none"};
$("ix").onclick=()=>{try{localStorage.setItem("insx","1")}catch(e){}$("ins").style.display="none"};
if(/iphone|ipad/i.test(navigator.userAgent)&&!sa&&!localStorage.getItem("iosx"))$("ios").style.display="block";
$("iox").onclick=()=>{try{localStorage.setItem("iosx","1")}catch(e){}$("ios").style.display="none"};
</script></body></html>
