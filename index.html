["أبي بن كعب","فضل أبي بن كعب (قول عمر: أقرؤنا أبي)","أفراد البخاري","يحيى القطان|سفيان الثوري|حبيب بن أبي ثابت|سعيد بن جبير|ابن عباس|عمر بن الخطاب"],
["أسامة بن زيد","صلاة العشاءين بعد الإفاضة","متفق عليه","الزهري|عبيد الله بن عبد الله|ابن عباس|أسامة بن زيد"]
].flatMap(r=>r[4]?r[4].split("|").map(x=>({m:r[0],t:r[1],k:r[2],c:[x,...r[3].split("|")]})):[{m:r[0],t:r[1],k:r[2],c:r[3].split("|")}]);
const norm=t=>t.replace(/ \(.*\)$/,"");
const G=new Map;D.forEach(d=>{const key=d.m+"|"+norm(d.t);if(!G.has(key))G.set(key,{m:d.m,t:norm(d.t),ks:new Set,cs:[]});const g=G.get(key);g.ks.add(d.k);g.cs.push(d.c)});
const H=[...G.values()];
const M=["الكل",...new Set(H.map(h=>h.m))];let cur="الكل",q="",sel=null,mode="sahabi";
const $=id=>document.getElementById(id);
function trie(chains){const r={k:new Map};chains.forEach(c=>{let n=r;c.forEach(x=>{if(!n.k.has(x))n.k.set(x,{k:new Map,c:0});n=n.k.get(x);n.c++})});return r}
function rd(n){let h="";n.k.forEach((v,nm)=>{h+=v.k.size?`<details open><summary><span class="n">${nm}</span></summary>${rd(v)}</details>`:`<div class="leaf">${nm}</div>`});return h}
function list(){
 const f=H.filter(h=>(cur==="الكل"||h.m===cur)&&(!q||(h.t+h.cs.map(c=>c.join(" ")).join(" ")).includes(q)));
 $("info").textContent=f.length+" حديثًا — اضغط على العنوان لترى شجرة إسناده";
 $("main").innerHTML=f.map(h=>`<div class="h t" data-i="${H.indexOf(h)}"><b>${h.t}</b><span class="b">${[...h.ks].join(" / ")}</span><div class="ct">${h.m} · ${h.cs.length} ${h.cs.length>1?"طرق":"طريق"}</div></div>`).join("")||'<div class="hint">لا نتائج</div>'}
function detail(){
 const h=H[sel];
 const ch=mode==="sahabi"?h.cs.map(c=>[...c].reverse()):h.cs;
 let body;
 if(mode==="lines")body=h.cs.map(c=>`<div class="h">${c.map((x,i)=>i==c.length-1?`<span class="c">${x}</span>`:x).join(' <span class="ct">←</span> ')}</div>`).join("");
 else body=`<div class="tree">${rd(trie(ch))}</div>`;
 const note={sahabi:"الصحابي في الأعلى ثم يتفرع إلى رواته",shaykh:"من أول راوٍ بعد الشيخين وصولًا إلى الصحابي",lines:"كل طريق في سطر مستقل"}[mode];
 $("info").textContent="";
 $("main").innerHTML=`<button class="tab" id="back">→ رجوع للقائمة</button><h2>${h.t}</h2><div class="ct">${h.m} · <span class="b">${[...h.ks].join(" / ")}</span></div>
 <div class="tabs">${[["sahabi","من الصحابي"],["shaykh","من الشيخ"],["lines","سلاسل"]].map(([k,l])=>`<button class="tab${k===mode?" on":""}" data-md="${k}">${l}</button>`).join("")}</div><div class="hint">${note}</div>${body}`;
 $("back").onclick=()=>{sel=null;page=from;show()};
 $("main").querySelectorAll("[data-md]").forEach(b=>b.onclick=()=>{mode=b.dataset.md;detail()});
 scrollTo(0,0)}
let page="h",from="h",SL=[],sub="core";
const AR=' <span class="ct">←</span> ';
function hl(c,seg){const k=seg.join("|");let a=0;for(;a<=c.length-seg.length;a++)if(c.slice(a,a+seg.length).join("|")===k)break;
 return c.map((x,i)=>i>=a&&i<a+seg.length?`<b class="hi">${x}</b>`:x).join(AR)}
const PIV=new Set("أبو إسحاق السبيعي|سليمان التيمي|عاصم الأحول|عاصم بن أبي النجود|الزهري|الأعمش|عدي بن ثابت|الشعبي|سلمة بن كهيل|قتادة|هشام بن عروة|محمد بن المنكدر|موسى بن عقبة|عمرو بن دينار|حبيب بن أبي ثابت|الحكم بن عتيبة|الأشعث بن سليم|سعد بن عبيدة|عمرو بن مرة|الجريري|عبيد الله بن أبي يزيد|عطاء بن أبي رباح".split("|"));
const FIRST=["أبو إسحاق السبيعي","سليمان التيمي","بندار"];
function topG(tp){const r=[...tp.values()].filter(t=>t.hs.size>=2);return r.filter(e=>!r.some(o=>o!==e&&o.seg.length>e.seg.length&&o.hs.size===e.hs.size&&("|"+o.k+"|").includes("|"+e.k+"|")))}
function chains(){
 const mp=new Map,tp=new Map;
 H.forEach((h,i)=>{if(cur!=="الكل"&&h.m!==cur)return;h.cs.forEach(c=>{let p=-1;for(let x=0;x<c.length-1;x++)if(PIV.has(c[x])){p=x;break}
  if(p<0)p=Math.max(0,c.length-2);const seg=c.slice(p),k=seg.join("|");let e=mp.get(k);if(!e){e={seg,k,hs:new Map,st:new Set};mp.set(k,e)}
  if(!e.hs.has(i))e.hs.set(i,[]);e.hs.get(i).push(c);if(p>0)e.st.add(c[p-1]);
  for(let a=0;a<p;a++)for(let b=a+2;b<=p;b++){const pre=c.slice(a,b),k2=pre.join("|");let t=tp.get(k2);if(!t){t={seg:pre,k:k2,hs:new Map,st:new Set};tp.set(k2,t)}if(!t.hs.has(i))t.hs.set(i,[]);t.hs.get(i).push(c);t.st.add(c[b])}})});
 const pr=e=>{const j=FIRST.indexOf(e.seg[0]);return j<0?9:j};
 SL=[...(sub==="top"?topG(tp):[...mp.values()].filter(t=>t.hs.size>=2))].filter(e=>!q||e.k.includes(q)||[...e.st].some(x=>x.includes(q))||[...e.hs.values()].some(cs=>cs.some(c=>c.join(" ").includes(q)))||[...e.hs.keys()].some(i=>H[i].t.includes(q)))
  .sort((a,b)=>pr(a)-pr(b)||b.hs.size-a.hs.size||b.seg.length-a.seg.length);
 $("info").textContent=SL.length+(sub==="top"?" سلسلة من أعلى السند (المكررة) — اضغط على عنوان الحديث لترى سلسلته كاملة":" سلسلة — لكل سلسلة راويها المدار وأصحابه، واضغط على عنوان الحديث لترى سلسلته كاملة");
 $("main").innerHTML=`<div class="tabs"><button class="tab${sub==="core"?" on":""}" data-sub="core">المدارات وأصحابهم</button><button class="tab${sub==="top"?" on":""}" data-sub="top">أعلى السند (بندار ← غندر ← شعبة)</button></div>`+SL.map((e,g)=>`<div class="g"><div class="gh">${e.seg.join(AR)} <span class="b">${e.hs.size} ${e.hs.size>10?"حديثًا":"أحاديث"}</span></div>${e.st.size?`<div class="ct">${sub==="top"?"ثم عن":"أصحابه عنه"}: ${[...e.st].map(x=>`<span class="chip">${x}</span>`).join("")}</div>`:""}${[...e.hs.keys()].map(i=>`<div class="h ti" data-g="${g}" data-i="${i}">${H[i].t}<span class="ct"> · ${H[i].m}</span></div><div class="full" style="display:none"></div>`).join("")}</div>`).join("")||'<div class="hint">لا نتائج</div>'}
function toggle(el){const f=el.nextElementSibling;if(f.style.display===""){f.style.display="none";return}
 const e=SL[+el.dataset.g],i=+el.dataset.i;
 f.innerHTML=e.hs.get(i).filter((c,x,a)=>a.findIndex(y=>y.join()===c.join())===x).map(c=>`<div class="h">${hl(c,e.seg)}</div>`).join("")+`<button class="tab" data-open="${i}">شجرة إسناد الحديث ←</button>`;f.style.display=""}
const CS=new Set("ابن عباس|أبي بن كعب|أسامة بن زيد|البراء بن عازب|سعد بن أبي وقاص|أبو جحيفة|أبو أيوب الأنصاري|أنس بن مالك|أسيد بن حضير|عمر بن الخطاب|عبد الله بن يزيد".split("|"));
function comp(){
 const mp=new Map;
 H.forEach((h,i)=>{if(cur!=="الكل"&&h.m!==cur)return;h.cs.forEach(c=>{for(let x=0;x<c.length-1;x++)if(CS.has(c[x])&&CS.has(c[x+1])){const seg=[c[x],c[x+1]],k=seg.join("|");let e=mp.get(k);if(!e){e={seg,k,hs:new Map,st:new Set};mp.set(k,e)}if(!e.hs.has(i))e.hs.set(i,[]);e.hs.get(i).push(c)}})});
 SL=[...mp.values()].filter(e=>!q||e.k.includes(q)||[...e.hs.keys()].some(i=>H[i].t.includes(q))).sort((a,b)=>b.hs.size-a.hs.size);
 $("info").textContent=SL.length+" رواية صحابي عن صحابي — اضغط على عنوان الحديث لترى سلسلته كاملة";
 $("main").innerHTML=SL.map((e,g)=>`<div class="g"><div class="gh">${e.seg.join(AR)} <span class="b">${e.hs.size==1?"حديث":e.hs.size==2?"حديثان":e.hs.size+" أحاديث"}</span></div><div class="ct">الراوي: ${e.seg[0]} — المروي عنه: ${e.seg[1]}</div>${[...e.hs.keys()].map(i=>`<div class="h ti" data-g="${g}" data-i="${i}">${H[i].t}<span class="ct"> · ${H[i].m}</span></div><div class="full" style="display:none"></div>`).join("")}</div>`).join("")||'<div class="hint">لا نتائج</div>'}
function refresh(){page==="h"?list():page==="s"?chains():comp()}
function show(){$("bar").style.display=sel===null?"":"none";sel===null?refresh():detail()}
$("tabs").innerHTML=M.map(m=>`<button class="tab${m===cur?" on":""}" data-m="${m}">${m}</button>`).join("");
$("tabs").onclick=e=>{const m=e.target.dataset.m;if(!m)return;cur=m;$("tabs").querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.m===m));refresh()};
$("q").oninput=e=>{q=e.target.value.trim();refresh()};
$("main").onclick=e=>{const sb=e.target.closest("[data-sub]");if(sb){sub=sb.dataset.sub;chains();return}const o=e.target.closest("[data-open]"),ti=e.target.closest(".ti"),t=e.target.closest(".t");
 if(o){from=page;sel=+o.dataset.open;show()}else if(ti)toggle(ti);else if(t){from=page;sel=+t.dataset.i;show()}};
$("nav").onclick=e=>{const p=e.target.dataset.p;if(!p)return;page=p;$("nav").querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.p===p));$("q").placeholder=p==="h"?"ابحث باسم راوٍ أو حديث…":"ابحث باسم راوٍ أو حديث…";refresh()};
show();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
